<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LexiCore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f8f5ff;
        --surface: #fffefe;
        --ink: #344054;
        --muted: #667085;
        --line: #eadff7;
        --primary: #b692f6;
        --primary-ink: #2d1f54;
        --soft: #f1e9ff;
        --soft-blue: #eaf6ff;
        --soft-mint: #eafaf1;
        --highlight: #fff0a8;
        --practice-font-size: 1rem;
        --warn: #9c6f2f;
        --bad: #b54708;
        --good: #16835f;
        --shadow: 0 12px 30px rgba(74, 58, 105, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Kanit", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      header {
        background: linear-gradient(135deg, #fde7ef 0%, #ede7ff 48%, #e3f6ff 100%);
        color: #3f315f;
        padding: 28px 20px;
        border-bottom: 1px solid rgba(182, 146, 246, 0.28);
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        letter-spacing: 0;
      }

      h1 {
        font-size: clamp(1.8rem, 4vw, 3rem);
      }

      .subtitle {
        margin: 8px 0 0;
        color: #635a7b;
      }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 22px 20px 48px;
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        gap: 18px;
      }

      aside,
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      aside {
        align-self: start;
        position: sticky;
        top: 16px;
        overflow: hidden;
      }

      .side-head {
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }

      .side-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .question-list {
        display: grid;
        max-height: 58vh;
        overflow: auto;
      }

      .practice-tools {
        display: grid;
        gap: 10px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        background: #fffefe;
      }

      .authoring-box {
        border-bottom: 1px solid var(--line);
        background: #fffafe;
      }

      .authoring-box summary {
        cursor: pointer;
        padding: 12px 16px;
        color: #4b376f;
        font-weight: 700;
      }

      .authoring-form {
        display: grid;
        gap: 10px;
        padding: 0 12px 14px;
      }

      .author-field {
        display: grid;
        gap: 4px;
      }

      .author-field label {
        color: #5d536f;
        font-size: 0.86rem;
        font-weight: 600;
      }

      .author-field input,
      .author-field select,
      .author-field textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fffbff;
        color: var(--ink);
        font: inherit;
      }

      .author-field textarea {
        min-height: 76px;
        resize: vertical;
      }

      .author-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .author-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .author-actions .primary {
        grid-column: 1 / -1;
      }

      .statute-picker {
        display: grid;
        gap: 8px;
      }

      .statute-picker-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 88px 88px;
        gap: 8px;
      }

      .statute-custom-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .selected-statutes {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 31px;
        align-items: center;
      }

      .statute-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #d9c8ff;
        border-radius: 999px;
        background: #f4eeff;
        color: #3f315f;
        padding: 4px 8px;
        font-size: 0.82rem;
      }

      .statute-chip button {
        min-width: auto;
        border: 0;
        background: transparent;
        color: #6d48b3;
        padding: 0;
        line-height: 1;
      }

      .author-status {
        min-height: 1.4em;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .practice-search {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 11px;
        font: inherit;
        color: var(--ink);
        background: #fffbff;
      }

      .status-filters {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .status-filter {
        padding: 7px 6px;
        font-size: 0.86rem;
      }

      .status-filter.active {
        background: #d8c7ff;
        color: #342056;
        border-color: #c7adff;
      }

      .course-tabs {
        display: grid;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
        background: #fffbff;
      }

      .course-tab {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 2px 8px;
        align-items: baseline;
        text-align: left;
        padding: 10px 11px;
      }

      .course-tab strong {
        font-weight: 700;
        color: #6d48b3;
      }

      .course-tab span {
        min-width: 0;
        font-weight: 500;
      }

      .course-tab small {
        grid-column: 2;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .course-tab.active {
        background: var(--primary);
        color: var(--primary-ink);
        border-color: var(--primary);
      }

      .course-tab.active strong,
      .course-tab.active small {
        color: var(--primary-ink);
      }

      .level-tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }

      .level-tab {
        padding: 8px 6px;
        font-size: 0.9rem;
      }

      .level-tab.active {
        background: var(--primary);
        color: var(--primary-ink);
        border-color: var(--primary);
      }

      .question-tab {
        appearance: none;
        border: 0;
        border-bottom: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        text-align: left;
        padding: 13px 16px;
        cursor: pointer;
        font: inherit;
      }

      .question-tab:hover,
      .question-tab.active {
        background: var(--soft);
      }

      .question-tab.done {
        background: var(--soft-mint);
        border-left: 4px solid var(--good);
      }

      .question-tab.done.active {
        background: #dff7ea;
      }

      .question-tab strong {
        display: block;
        color: #4b376f;
        font-weight: 600;
      }

      .question-tab span {
        color: #5f6678;
        font-size: 0.86rem;
      }

      .question-tab.active strong,
      .question-tab.active span {
        color: #32214f;
      }

      .done-badge {
        display: inline-block;
        margin-top: 5px;
        border: 1px solid rgba(6, 118, 71, 0.28);
        border-radius: 999px;
        background: #f0fbf4;
        color: var(--good);
        padding: 2px 7px;
        font-size: 0.78rem;
      }

      .question-empty,
      .empty-state {
        color: var(--muted);
      }

      .question-empty {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        font-size: 0.92rem;
      }

      .empty-state {
        min-height: 260px;
        display: grid;
        align-content: center;
        gap: 8px;
      }

      .empty-state p {
        margin: 0;
      }

      .panel {
        padding: 22px;
      }

      .reader-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 8px 0 14px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fdf8ff;
      }

      .reader-toolbar-group {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .reader-toolbar-label {
        color: var(--muted);
        font-size: 0.86rem;
      }

      .reader-toolbar button {
        min-width: 40px;
        padding: 7px 10px;
      }

      .reading-surface {
        font-size: var(--practice-font-size);
      }

      .reading-surface .scenario,
      .reading-surface .question-text,
      .reading-surface label.choice,
      .reading-surface .match-row,
      .reading-surface .drag-item,
      .reading-surface .drop-zone,
      .reading-surface textarea,
      .reading-surface .answer-box {
        font-size: inherit;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }

      .pill {
        border: 1px solid var(--line);
        background: #fffbff;
        color: var(--muted);
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 0.84rem;
      }

      .statute-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .statute-row {
        display: grid;
        gap: 7px;
        margin: 0 0 14px;
        padding: 12px;
        border: 1px solid rgba(182, 146, 246, 0.3);
        border-radius: 8px;
        background: #f7f0ff;
      }

      .statute-row-label {
        color: #6d48b3;
        font-size: 0.82rem;
        font-weight: 600;
        text-transform: uppercase;
      }

      .statute-button {
        border-color: rgba(182, 146, 246, 0.52);
        background: var(--soft);
        color: #4b376f;
        font-weight: 500;
        padding: 5px 10px;
      }

      .statute-button:hover,
      .statute-button.active {
        background: var(--primary);
        color: var(--primary-ink);
        border-color: var(--primary);
      }

      .scenario {
        margin: 16px 0;
        padding: 16px;
        border-left: 4px solid var(--primary);
        background: #fffbff;
        border-radius: 8px;
      }

      .question-text {
        font-weight: 500;
        margin: 16px 0;
      }

      .choices,
      .matching,
      .drag-grid {
        display: grid;
        gap: 10px;
        margin: 12px 0;
      }

      label.choice,
      .match-row,
      .drag-item,
      .drop-zone {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #fbfcfc;
      }

      label.choice {
        display: flex;
        gap: 10px;
        cursor: pointer;
      }

      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
      }

      textarea {
        min-height: 160px;
        resize: vertical;
      }

      .match-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 190px;
        gap: 12px;
        align-items: center;
      }

      .drag-grid {
        grid-template-columns: 1fr 1fr;
      }

      .drop-zone {
        min-height: 90px;
      }

      .drop-zone h3 {
        font-size: 0.95rem;
        margin-bottom: 8px;
      }

      .drag-item {
        cursor: grab;
      }

      .drag-item.used {
        opacity: 0.45;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font: inherit;
        padding: 9px 13px;
        cursor: pointer;
      }

      button.primary {
        background: var(--primary);
        color: var(--primary-ink);
        border-color: var(--primary);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .hint-box,
      .result,
      .answer-box,
      .statute-box {
        margin-top: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        background: #fbfcfc;
      }

      .result.good {
        border-color: rgba(6, 118, 71, 0.35);
        background: #effaf5;
      }

      .result.bad {
        border-color: rgba(180, 35, 24, 0.35);
        background: #fff3f1;
      }

      .score {
        font-size: 1.4rem;
        font-weight: 500;
      }

      .feedback-list {
        margin: 10px 0 0;
        padding-left: 20px;
      }

      .small {
        color: var(--muted);
        font-size: 0.9rem;
      }

      details {
        margin-top: 10px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }

      summary {
        cursor: pointer;
        font-weight: 500;
      }

      .answer-box {
        background: #fffbff;
        border-color: rgba(182, 146, 246, 0.42);
      }

      .answer-box h3,
      .statute-box h3 {
        font-size: 1rem;
        margin-bottom: 8px;
      }

      .answer-source {
        display: inline-flex;
        align-items: center;
        border: 1px solid rgba(138, 75, 18, 0.24);
        background: #fff4dd;
        color: var(--warn);
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 0.86rem;
        margin: 4px 0 12px;
      }

      .model-paragraph {
        background: #ffffff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        margin: 8px 0 12px;
      }

      .model-paragraph p {
        margin: 0 0 0.9rem;
      }

      .model-paragraph p:last-child {
        margin-bottom: 0;
      }

      .model-answer-section {
        display: grid;
        gap: 6px;
        margin: 0 0 14px;
      }

      .model-answer-section:last-child {
        margin-bottom: 0;
      }

      .model-answer-section h4 {
        margin: 0;
        font-size: 0.96rem;
        color: #5a3d91;
      }

      .model-paragraph mark {
        background: #efe6ff;
        color: #5a3d91;
        border-radius: 4px;
        padding: 0 4px;
      }

      .user-highlight {
        background: var(--highlight);
        border-radius: 4px;
        box-shadow: 0 0 0 2px rgba(255, 240, 168, 0.5);
        padding: 0 2px;
      }

      .key-points {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 10px 0;
      }

      .key-point {
        border-radius: 999px;
        padding: 4px 9px;
        font-size: 0.86rem;
        border: 1px solid transparent;
      }

      .key-point.issue {
        background: #eef4ff;
        border-color: #c7d7fe;
        color: #1d4ed8;
      }

      .key-point.rule {
        background: #ecfdf3;
        border-color: #abefc6;
        color: #067647;
      }

      .key-point.fact {
        background: #fff4dd;
        border-color: #fedf89;
        color: #8a4b12;
      }

      .key-point.conclusion {
        background: #f4f3ff;
        border-color: #d9d6fe;
        color: #5925dc;
      }

      .inline-statute-note {
        margin-top: 10px;
        border: 1px solid rgba(182, 146, 246, 0.42);
        border-radius: 8px;
        background: var(--soft);
        padding: 12px;
      }

      .statute-law-text {
        display: grid;
        gap: 8px;
      }

      .statute-law-text strong {
        color: #6d48b3;
      }

      .statute-law-text blockquote {
        margin: 0;
        padding: 10px 12px;
        border-left: 4px solid var(--primary);
        background: #ffffff;
        border-radius: 8px;
      }

      .statute-law-text blockquote p {
        margin: 0 0 0.75rem;
        line-height: 1.75;
      }

      .statute-law-text blockquote p:last-child {
        margin-bottom: 0;
      }

      .statute-law-note {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .answer-box ol {
        margin: 8px 0 0;
        padding-left: 22px;
      }

      @media (max-width: 860px) {
        main {
          display: block;
          padding: 16px 14px 36px;
        }

        aside {
          position: static;
          margin-bottom: 16px;
        }

        .match-row,
        .drag-grid {
          grid-template-columns: 1fr;
        }

        .panel {
          padding: 16px;
        }

        .reader-toolbar {
          align-items: stretch;
        }

        .reader-toolbar-group,
        .reader-toolbar button {
          flex: 1 1 auto;
        }
      }

      @media (max-width: 520px) {
        header {
          padding: 22px 16px;
        }

        .level-tabs,
        .status-filters,
        .author-grid,
        .author-actions,
        .statute-picker-row,
        .statute-custom-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>LexiCore</h1>
      </div>
    </header>

    <main>
      <aside>
        <div class="side-head">
          <h2>คำถาม</h2>
          <p id="summary"></p>
        </div>
        <div class="course-tabs" id="courseTabs"></div>
        <div class="level-tabs" id="levelTabs"></div>
        <div class="practice-tools">
          <input class="practice-search" id="questionSearch" type="search" placeholder="ค้นหาคำถาม มาตรา หรือหมวด" />
          <div class="status-filters" id="statusFilters">
            <button class="status-filter active" data-status-filter="all" type="button">ทั้งหมด</button>
            <button class="status-filter" data-status-filter="todo" type="button">ยังไม่ได้ทำ</button>
            <button class="status-filter" data-status-filter="done" type="button">ทำแล้ว</button>
          </div>
        </div>
        <details class="authoring-box" id="authoringBox">
          <summary>เพิ่มโจทย์เอง</summary>
          <form class="authoring-form" id="authoringForm">
            <div class="author-grid">
              <div class="author-field">
                <label for="authorCourse">วิชา</label>
                <select id="authorCourse" name="course_id"></select>
              </div>
              <div class="author-field">
                <label for="authorLevel">Level</label>
                <select id="authorLevel" name="level">
                  <option value="1">Level 1</option>
                  <option value="2" selected>Level 2</option>
                  <option value="3">Level 3</option>
                </select>
              </div>
            </div>
            <div class="author-field">
              <label for="authorTitle">Heading / ชื่อข้อ</label>
              <input id="authorTitle" name="title" type="text" placeholder="เว้นว่างได้ ระบบจะตั้งจากมาตรา" />
            </div>
            <div class="author-grid">
              <div class="author-field">
                <label for="authorModule">หมวด</label>
                <input id="authorModule" name="module" type="text" placeholder="เช่น ละเมิด" />
              </div>
              <div class="author-field">
                <label for="authorSource">ที่มา</label>
                <input id="authorSource" name="source" type="text" placeholder="เพิ่มเอง" />
              </div>
            </div>
            <div class="author-field">
              <label for="authorStatutes">เลขมาตรา</label>
              <input id="authorStatutes" name="statutes" type="hidden" />
              <div class="statute-picker">
                <div class="statute-picker-row">
                  <select id="authorStatuteSelect"></select>
                  <select id="authorParagraphSelect" aria-label="วรรค">
                    <option value="">ไม่ระบุวรรค</option>
                    <option value="วรรค 1">วรรค 1</option>
                    <option value="วรรค 2">วรรค 2</option>
                    <option value="วรรค 3">วรรค 3</option>
                    <option value="วรรค 4">วรรค 4</option>
                    <option value="วรรค 5">วรรค 5</option>
                    <option value="วรรค 6">วรรค 6</option>
                    <option value="วรรค 7">วรรค 7</option>
                    <option value="วรรค 8">วรรค 8</option>
                    <option value="วรรค 9">วรรค 9</option>
                    <option value="วรรค 10">วรรค 10</option>
                  </select>
                  <select id="authorItemSelect" aria-label="อนุ">
                    <option value="">ไม่ระบุอนุ</option>
                    <option value="(1)">(1)</option>
                    <option value="(2)">(2)</option>
                    <option value="(3)">(3)</option>
                    <option value="(4)">(4)</option>
                    <option value="(5)">(5)</option>
                    <option value="(6)">(6)</option>
                    <option value="(7)">(7)</option>
                    <option value="(8)">(8)</option>
                    <option value="(9)">(9)</option>
                    <option value="(10)">(10)</option>
                  </select>
                </div>
                <button id="addSelectedStatuteBtn" type="button">เพิ่มมาตราที่เลือก</button>
                <div class="statute-custom-row">
                  <input id="authorCustomStatute" type="text" placeholder="หรือพิมพ์เอง เช่น 59 วรรค 4" />
                  <button id="addCustomStatuteBtn" type="button">เพิ่มเอง</button>
                </div>
                <div class="selected-statutes" id="selectedStatutes"></div>
              </div>
            </div>
            <div class="author-field">
              <label for="authorScenario">ข้อเท็จจริง / โจทย์</label>
              <textarea id="authorScenario" name="scenario" required></textarea>
            </div>
            <div class="author-field">
              <label for="authorQuestion">คำถาม</label>
              <textarea id="authorQuestion" name="question" required></textarea>
            </div>
            <div class="author-field">
              <label for="authorAnswer">เฉลย</label>

      const generatedStatuteNotesByCourse = {
        "41215": Object.fromEntries((window.LEXICORE_STATUTES_41215 || []).map(entry => [
          entry.section,
          {

      function statuteEntry(statute, courseId) {
        const courseEntries = generatedStatuteNotesByCourse[courseId] || {};
        const key = statuteKey(statute);
        const generatedEntry = courseEntries[key];
        if (generatedEntry && !isPlaceholderStatuteText(generatedEntry.text)) {
          return generatedEntry;
        }
        return statuteNotes[key] || generatedEntry;
      }

      function statuteKey(statute) {
        return String(statute || "").match(/\d{1,4}/)?.[0] || String(statute || "").trim();
      }

      function isPlaceholderStatuteText(text) {
        return /^เนื้อหาตามประมวลกฎหมาย/u.test(String(text || "").trim());
      }

      function statuteButtonText(statute) {
        return String(statute || "").replace(/^มาตรา\s*/u, "").trim();
      }

      function thaiNumberToInt(value) {
        return {
          "แรก": 1,
          "หนึ่ง": 1,
          "1": 1,
          "สอง": 2,
          "2": 2,
          "สาม": 3,
          "3": 3,
          "สี่": 4,
          "4": 4,
          "ห้า": 5,
          "5": 5,
          "หก": 6,
          "6": 6,
          "เจ็ด": 7,
          "7": 7,
          "แปด": 8,
          "8": 8,
          "เก้า": 9,
          "9": 9,
          "สิบ": 10,
          "10": 10
        }[String(value || "").trim()] || null;
      }

      function statuteParagraphIndex(statute) {
        return thaiNumberToInt(String(statute || "").match(/วรรค\s*([^\s()]+)/u)?.[1]);
      }

      function statuteItemIndex(statute) {
        return Number(String(statute || "").match(/\((\d{1,2})\)/)?.[1]) || null;
      }

      function splitStatuteParagraphs(content) {
        return String(content || "")
          .replace(/\s+(ถ้ามีผู้ได้มาซึ่งอสังหาริมทรัพย์หรือทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์โดยทางอื่นนอกจากนิติกรรม)/gu, "\n$1")
          .replace(/\s+(กระทำโดยเจตนา ได้แก่)/gu, "\n$1")
          .replace(/\s+(ถ้าผู้กระทำมิได้รู้ข้อเท็จจริง)/gu, "\n$1")
          .replace(/\s+(กระทำโดยประมาท ได้แก่)/gu, "\n$1")
          .replace(/\s+(การกระทำ ให้หมายความรวมถึง)/gu, "\n$1")
          .replace(/\s+(ถ้าตามกฎหมายที่บัญญัติในภายหลัง)/gu, "\n$1")
          .replace(/\s+(แต่ในกรณีที่คดีถึงที่สุดแล้ว)/gu, "\n$1")
          .replace(/\s+(ผู้ใดพยายามกระทำความผิด)/gu, "\n$1")

      function statuteItemExcerpt(content, item) {
        if (!item) return "";
        const match = String(content || "").match(new RegExp(`\\(${item}\\)\\s*([\\s\\S]*?)(?=\\s*\\(${item + 1}\\)\\s|$)`));
        return match?.[0]?.trim() || "";
      }

      function statuteContentForDisplay(entry, statute) {
        const item = statuteItemExcerpt(entry.text, statuteItemIndex(statute));
        if (item) return [item];

        const paragraphs = splitStatuteParagraphs(entry.text);
        const paragraphIndex = statuteParagraphIndex(statute);
        if (paragraphIndex && paragraphs[paragraphIndex - 1]) {
          return [paragraphs[paragraphIndex - 1]];
        }
        return paragraphs;
      }

        return String(step || "").replace(/^\s*(?:\d+|[๐-๙]+)[.)]\s*/, "").trim();

      function parseTableCriteria(criteriaText, statutes) {
        if (!criteriaText) {
          return [
            { id: "issue", label: "จับประเด็นข้อกฎหมาย", points: 2, keywords: statutes },
            { id: "rule", label: "ระบุมาตราที่เกี่ยวข้อง", points: 3, keywords: statutes },
            { id: "application", label: "ปรับข้อเท็จจริงเข้ากับหลักกฎหมาย", points: 3, keywords: ["วินิจฉัย", "ปรับบท", "ข้อเท็จจริง"] },
            { id: "conclusion", label: "สรุปผลทางกฎหมาย", points: 2, keywords: ["สรุป", "ดังนั้น", "จึง"] }
          ];
        }
        return criteriaText.split("|").map((raw, index) => {
          const text = raw.trim();
          const pointMatch = text.match(/\((\d+) คะแนน\)/);
          const label = text.replace(/\s*\(\d+ คะแนน\)/, "");
          return {
            id: `criteria_${index + 1}`,
            label,
            points: pointMatch ? Number(pointMatch[1]) : 2,
            keywords: [...statutes, ...label.split(/\s+/).filter(word => word.length > 2).slice(0, 4)]
          };
        });
      }

      function normalizeStatutes(value) {

          .split(",")

      function moduleLabel(moduleId) {
        return {
          "module-01-torts-unjust-enrichment": "ละเมิด / จัดการงานนอกสั่ง / ลาภมิควรได้",
          "module-02-property": "ทรัพย์สิน"
        }[moduleId] || moduleId || "Level 1";
      }

      function cleanSourceLabel(source) {
        const label = String(source || "").trim();
        const hiddenLabels = ["คำถามที่" + "เขียนตอบ", "นำเข้า" + "จากไฟล์แนบ"];
        if (!label || hiddenLabels.includes(label)) {
          return "คำถาม";
        }
        return hiddenLabels.reduce((cleaned, hidden) => cleaned.split(hidden).join("คำถาม"), label);
      }

      function compactLevelOneTitle(row, module, statutes) {
        const itemNumber = String(row.display_number || row["ข้อที่"] || "").trim();
        if (itemNumber) {
          return `ข้อ ${itemNumber}`;
        }

        const question = String(row["คำถาม (Question)"] || "").trim();
        const rawTitle = String(row.title || "").trim();
        const normalizedQuestion = question.replace(/\s+/g, "");
        const normalizedTitle = rawTitle.replace(/\s+/g, "");
        const titleRepeatsQuestion = normalizedTitle && (
          normalizedTitle === normalizedQuestion ||
          normalizedQuestion.startsWith(normalizedTitle) ||
          normalizedTitle.startsWith(normalizedQuestion)
        );
        const shouldCompact = !rawTitle || titleRepeatsQuestion || rawTitle.length > 34;
        if (!shouldCompact) {
          return rawTitle;
        }

        const compacted = (rawTitle || question)
          .replace(/^\s*(ข้อใด|ข้อความใด|สถานการณ์ใด|กรณีใด|การกระทำใด)\s*(เป็น|มิใช่|ไม่ใช่|กล่าวถูกต้อง|กล่าวไม่ถูกต้อง|ควร|สามารถ)?\s*/u, "")
          .replace(/^\s*(ให้นักเรียน|ให้)\s*(วินิจฉัย|เลือก|จับคู่|ลาก)?\s*/u, "")
          .replace(/\s+/g, " ")
          .trim()
          .replace(/[?？]+$/u, "");
        const parenthetical = compacted.match(/\(([^)]+)\)/);
        if (parenthetical?.[1] && parenthetical[1].length <= 34) {
          return parenthetical[1].trim();
        }

        if (compacted && compacted.length <= 34) {
          return compacted;
        }
        if (compacted) {
          return `${compacted.slice(0, 33).trim()}...`;
        }
        if (statutes.length) {
          return `มาตรา ${statutes.join(", ")}`;
        }
        return module;
      }

      function parseChoiceText(choiceText) {
        const choices = [];
        const lines = String(choiceText || "").replace(/\\n/g, "\n").split("\n").map(line => line.trim()).filter(Boolean);
        for (const line of lines) {
          const match = line.match(/^([กขคงจฉชซฌญ])\.\s*(.+)$/);
          if (match) {
            choices.push({ id: match[1], text: match[2] });
          }
        }
        return choices;
      }

      function parseNumberedPrompts(choiceText) {
        return String(choiceText || "")
          .replace(/\\n/g, "\n")
          .split("\n")
          .map(line => line.trim())
          .filter(Boolean)
          .map(line => line.replace(/^\d+\.\s*/, ""));
      }

      function parseMatchingPairs(choiceText, answerText) {
        const prompts = parseNumberedPrompts(choiceText);
        const answerByIndex = new Map(
          String(answerText || "")
            .split("|")
            .map(item => item.trim())
            .filter(Boolean)
            .map(item => {
              const [index, answer] = item.split("=").map(part => part.trim());
              return [Number(index) - 1, answer];
            })
        );
        return prompts
          .map((prompt, index) => ({ prompt, answer: answerByIndex.get(index) || "" }))
          .filter(pair => pair.prompt && pair.answer);
      }

      function parseDragQuestion(row) {
        const choiceText = String(row["ตัวเลือก (Choices)"] || "").replace(/\\n/g, "\n");
        const itemLine = choiceText.split("\n").find(line => line.startsWith("รายการลาก:")) || "";
        const zoneLine = choiceText.split("\n").find(line => line.startsWith("กล่องคำตอบ:")) || "";
        const dragItems = itemLine.replace("รายการลาก:", "").split("|").map(item => {
          const [id, text] = item.split("=").map(part => part.trim());
          return id && text ? { id, text } : null;
        }).filter(Boolean);
        const dropZones = zoneLine.replace("กล่องคำตอบ:", "").split("|").map(item => {
          const [id, label] = item.split("=").map(part => part.trim());
          return id && label ? { id, label } : null;
        }).filter(Boolean);
        const zoneByLabel = new Map(dropZones.map(zone => [zone.label, zone.id]));
        const itemByText = new Map(dragItems.map(item => [item.text, item.id]));
        const mapping = {};
        String(row["เฉลย (Answer)"] || "").split("|").forEach(item => {
          const [text, label] = item.split("=").map(part => part.trim());
          const itemId = itemByText.get(text);
          const zoneId = zoneByLabel.get(label);
          if (itemId && zoneId) mapping[itemId] = zoneId;
        });
        return dragItems.length && dropZones.length && Object.keys(mapping).length
          ? { type: "drag_drop", dragItems, dropZones, mapping }
          : null;
      }

      function levelOneRowToQuestion(row) {
        const format = String(row["รูปแบบโจทย์"] || "").toLowerCase();
        const explanation = row["คำอธิบายเหตุผล (Explanation)"] || "ดูคำอธิบายประกอบเฉลย";
        const statutes = normalizeStatutes(row["มาตราที่เกี่ยวข้อง (Sections)"]);
        const module = moduleLabel(row.module_id);
        const base = {
          id: row.question_id,
          courseId: row.course_id || DEFAULT_COURSE_ID,
          title: compactLevelOneTitle(row, module, statutes),
          level: Number(row.level || 1),
          module,
          source: "คำถาม",
          statutes,
          scenario: row.source_kind === "existing_level_1_yaml" ? row["คำถาม (Question)"] : "",
          question: row.source_kind === "existing_level_1_yaml" ? "เลือกคำตอบที่ถูกต้อง" : row["คำถาม (Question)"],
          hints: [row.hint_1, row.hint_2, row.hint_3].filter(Boolean)
        };

        if (format.includes("drag")) {
          const parsed = parseDragQuestion(row);
          if (parsed) return { ...base, ...parsed };
        }

        if (format.includes("matching")) {
          const pairs = parseMatchingPairs(row["ตัวเลือก (Choices)"], row["เฉลย (Answer)"]);
          const options = [...new Set(pairs.map(pair => pair.answer))];
          if (pairs.length) {
            return {
              ...base,
              type: "matching",
              pairs,
              options,
              hints: base.hints.length ? base.hints : ["จับคู่ข้อความกับคำตอบที่สัมพันธ์กันมากที่สุด"]
            };
          }
        }

        const answer = String(row["เฉลย (Answer)"] || "").trim();
        const choices = parseChoiceText(row["ตัวเลือก (Choices)"]).map(choice => ({
          ...choice,
          correct: choice.id === answer,
          rationale: choice.id === answer ? explanation : `คำตอบที่ถูกคือ ${answer}. ${explanation}`
        }));
        return {
          ...base,
          type: "mcq",
          choices,
          hints: base.hints.length ? base.hints : [
            "อ่านโจทย์แล้วแยกว่าถามองค์ประกอบ หลักทั่วไป หรือมาตราที่ต้องใช้",
            "ตัดตัวเลือกที่ขัดกับคำสำคัญในมาตราหรือหลักกฎหมาย",
            base.statutes.length ? `พิจารณามาตรา ${base.statutes.join(", ")}` : "พิจารณาหลักกฎหมายที่เกี่ยวข้อง"
          ]
        };
      }

        const statutes = normalizeAuthorStatutes(row.statutes);
        return {
          question_id: safe.question_id || nextAuthorQuestionId(row.course_id || DEFAULT_COURSE_ID, row.level || 2),
          status: row.status || "draft",
          course_id: row.course_id || DEFAULT_COURSE_ID,
          level: Number(row.level) || 2,
          module: safe.module || "เพิ่มเอง",
          source: safe.source || "เพิ่มเอง",
          statutes,
          title: safe.title || defaultAuthorTitle(row.course_id || DEFAULT_COURSE_ID, statutes, safe.module),
          scenario: safe.scenario || "",
          question: safe.question || "",
          model_answer: safe.model_answer || "",
          answer_steps: splitAuthorList(safe.answer_steps, "|"),
          hint_1: safe.hint_1,
          hint_2: safe.hint_2,
          hint_3: safe.hint_3,
          criteria: safe.criteria || "",
          source_note: safe.source_note || safe.source || "เพิ่มเอง"
        };
      }

      function authorRowToQuestion(row) {
        return {
          ...tableRowToQuestion(draftCsvRowToWebsiteRow(row)),
          authorDraft: true
        };
      }

      function defaultAuthorTitle(courseId, statutes, moduleName) {
        const statuteNames = statutes
          .map(statute => {
            const entry = statuteEntry(statute, courseId);
            return entry?.title ? `ม.${statute} ${entry.title}` : `ม.${statute}`;
          })
          .join(" / ");
        if (statuteNames) return statuteNames;
        return moduleName ? `โจทย์ฝึกเขียน: ${moduleName}` : "โจทย์ฝึกเขียนเพิ่มเอง";
      }

      function autoHintsForAuthorRow(row) {
        const courseId = row.course_id || DEFAULT_COURSE_ID;
        const statutes = normalizeAuthorStatutes(row.statutes);
        const statuteTitles = statutes
          .map(statute => {
            const entry = statuteEntry(statute, courseId);
            return entry?.title ? `ม.${statute} ${entry.title}` : `ม.${statute}`;
          })
          .join(", ");
        return [
          row.module ? `เริ่มจากแยกประเด็นในหมวด ${row.module}` : "เริ่มจากแยกประเด็นข้อกฎหมายหลักในโจทย์",
          statuteTitles ? `หลักที่ควรนึกถึงคือ ${statuteTitles}` : "ดูว่าข้อเท็จจริงเข้าองค์ประกอบกฎหมายใด",
          statutes.length ? `พิจารณามาตรา ${statutes.join(", ")}` : "ระบุมาตราที่เกี่ยวข้องก่อนปรับบท"
        ];
      }

      function nextAuthorQuestionId(courseId, level) {
        return `custom-${courseId}-l${level}-${Date.now().toString(36)}`;
      }

      function loadProgress() {
        try {
          return JSON.parse(localStorage.getItem(progressKey) || "{}");
        } catch (error) {
          return {};
        }
      }

      function saveProgress() {
        try {
          localStorage.setItem(progressKey, JSON.stringify(state.completed));
        } catch (error) {
          // Ignore storage failures in local file mode.
        }
      }

      function updateAuthorStatus(message) {
        if (!authorStatus) return;
        const count = authorRows.length;
        authorStatus.textContent = message || `${count} draft${count === 1 ? "" : "s"} พร้อม export`;
      }

      function markCompleted(questionId) {
        state.completed[questionId] = new Date().toISOString();
        saveProgress();
      }

      function unmarkCompleted(questionId) {
        delete state.completed[questionId];
        saveProgress();
      }

      function isCompleted(questionId) {
        return Boolean(state.completed[questionId]);
      }

      function currentFontSize() {
        return fontSizes[Math.min(Math.max(state.fontStep + 1, 0), fontSizes.length - 1)];
      }

      function applyFontSize() {
        document.documentElement.style.setProperty("--practice-font-size", currentFontSize());
      }

      function currentCourse() {
        return courseCatalog.find(course => course.id === state.courseId) || courseCatalog[0];
      }

      function courseQuestions() {
        return questions.filter(q => q.courseId === state.courseId);
      }

      function firstAvailableLevel(courseId) {
        const courseLevels = questions
          .filter(q => q.courseId === courseId)
          .map(q => q.level)
          .sort((a, b) => a - b);
        return courseLevels[0] || 1;
      }

      function visibleQuestions() {
        const search = state.search.trim().toLowerCase();
        return courseQuestions().filter(q => {
          if (q.level !== state.level) return false;
          const done = isCompleted(q.id);
          if (state.statusFilter === "todo" && done) return false;
          if (state.statusFilter === "done" && !done) return false;
          if (!search) return true;
          const haystack = [
            q.title,
            q.module,
            q.source,
            q.scenario,
            q.question,
            ...(q.statutes || [])
          ].join(" ").toLowerCase();
          return haystack.includes(search);
        });
      }

      function bindTools() {
        bindAuthoringTools();
        questionSearch.addEventListener("input", () => {
          state.search = questionSearch.value;
          state.index = 0;
          resetQuestionState();
          render();
        });
        statusFilters.querySelectorAll("button").forEach(button => {
          button.addEventListener("click", () => {
            state.statusFilter = button.dataset.statusFilter;
            state.index = 0;
            resetQuestionState();
            render();
          });
        });
      }

      function bindAuthoringTools() {
        authorCourse.innerHTML = courseCatalog.map(course => (
          `<option value="${course.id}">${course.code} ${course.title}</option>`
        )).join("");
        authorCourse.value = state.courseId;
        authorLevel.value = String(state.level || 2);
        renderAuthorStatuteOptions(authorCourse.value);
        syncSelectedAuthorStatutes();
        updateAuthorStatus();

        authorCourse.addEventListener("change", () => {
          renderAuthorStatuteOptions(authorCourse.value);
        });

        addSelectedStatuteBtn.addEventListener("click", () => {
          addAuthorStatute(selectedStatuteValue());
        });

        addCustomStatuteBtn.addEventListener("click", () => {
          addAuthorStatute(authorCustomStatute.value);
          authorCustomStatute.value = "";
        });

        authorCustomStatute.addEventListener("keydown", event => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          addCustomStatuteBtn.click();
        });

        authoringForm.addEventListener("submit", event => {
          event.preventDefault();
          const formData = new FormData(authoringForm);
          const courseId = String(formData.get("course_id") || DEFAULT_COURSE_ID);
          const level = Number(formData.get("level") || 2);
          const statutes = normalizeAuthorStatutes(authorStatutes.value);
          if (!statutes.length) {
            updateAuthorStatus("เลือกหรือเพิ่มเลขมาตราก่อน preview");
            return;
          }
          const moduleName = String(formData.get("module") || "").trim();
          const source = String(formData.get("source") || "").trim() || "เพิ่มเอง";
          const hintLines = String(formData.get("hints") || "")
            .split(/\n+/)
            .map(line => line.trim())
            .filter(Boolean);
          const baseRow = {
            question_id: editingAuthorId || nextAuthorQuestionId(courseId, level),
            status: "ready",
            course_id: courseId,
            level: String(level),
            module: moduleName || "เพิ่มเอง",
            source,
            statutes: statutes.join(", "),
            title: String(formData.get("title") || "").trim() || defaultAuthorTitle(courseId, statutes, moduleName),
            scenario: String(formData.get("scenario") || "").trim(),
            question: String(formData.get("question") || "").trim(),
            model_answer: String(formData.get("model_answer") || "").trim(),
            answer_steps: "ประเด็น | หลักกฎหมาย | ปรับบท | สรุป",
            hint_1: hintLines[0] || "",
            hint_2: hintLines[1] || "",
            hint_3: hintLines[2] || "",
            criteria: "",
            source_note: source
          };
          const generatedHints = autoHintsForAuthorRow(baseRow);
          baseRow.hint_1 ||= generatedHints[0];
          baseRow.hint_2 ||= generatedHints[1];
          baseRow.hint_3 ||= generatedHints[2];

          const rowIndex = authorRows.findIndex(row => row.question_id === baseRow.question_id);
          if (rowIndex >= 0) {
            authorRows[rowIndex] = baseRow;
          } else {
            authorRows.push(baseRow);
          }
          saveAuthorRows();
          const question = authorRowToQuestion(baseRow);
          const questionIndex = questions.findIndex(item => item.id === question.id);
          if (questionIndex >= 0) {
            questions[questionIndex] = question;
          } else {
            questions.push(question);
          }
          editingAuthorId = baseRow.question_id;
          state.courseId = courseId;
          state.level = level;
          state.statusFilter = "all";
          state.search = "";
          questionSearch.value = "";
          state.index = Math.max(visibleQuestions().findIndex(item => item.id === question.id), 0);
          resetQuestionState();
          authorCourse.value = courseId;
          authorLevel.value = String(level);
          renderAuthorStatuteOptions(courseId);
          syncSelectedAuthorStatutes();
          authorSubmitBtn.textContent = "บันทึกและ preview";
          updateAuthorStatus(rowIndex >= 0 ? "บันทึก draft แล้ว และเปิด preview ให้ทันที" : "เพิ่มโจทย์แล้ว ฟอร์มยังค้างไว้ให้แก้ต่อได้");
          render();
        });

        exportCsvBtn.addEventListener("click", () => {
          exportAuthorRowsAsCsv();
        });

        exportJsonBtn.addEventListener("click", () => {
          exportAuthorRowsAsJson();
        });

        newDraftBtn.addEventListener("click", () => {
          startNewAuthorDraft();
        });
      }

      function csvCell(value) {
        const text = String(value || "");
        if (/[",\n\r]/.test(text)) {
          return `"${text.replace(/"/g, '""')}"`;
        }
        return text;
      }

      function downloadTextFile(filename, mimeType, text) {
        const blob = new Blob([text], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function rowsToCsv(rows) {
        return [
          authoringCsvColumns.join(","),
          ...rows.map(row => authoringCsvColumns.map(column => csvCell(row[column])).join(","))
        ].join("\n");
      }

      function rowsGroupedByCourse(rows) {
        return rows.reduce((groups, row) => {
          const courseId = row.course_id || DEFAULT_COURSE_ID;
          groups[courseId] ||= [];
          groups[courseId].push(row);
          return groups;
        }, {});
      }

      function timestampForFilename(date = new Date()) {
        const pad = value => String(value).padStart(2, "0");
        return [
          date.getFullYear(),
          pad(date.getMonth() + 1),
          pad(date.getDate())
        ].join("-") + `-${pad(date.getHours())}${pad(date.getMinutes())}`;
      }

      function exportAuthorRowsAsCsv() {
        if (!authorRows.length) {
          updateAuthorStatus("ยังไม่มี draft สำหรับ export");
          return;
        }
        const groups = rowsGroupedByCourse(authorRows);
        const timestamp = timestampForFilename();
        Object.entries(groups).forEach(([courseId, rows]) => {
          downloadTextFile(
            `${timestamp}-${courseId}-writing-import.csv`,
            "text/csv;charset=utf-8",
            rowsToCsv(rows)
          );
        });
        updateAuthorStatus(`Export CSV แล้ว ${authorRows.length} ข้อ แยกเป็น ${Object.keys(groups).length} วิชา`);
      }

      function exportAuthorRowsAsJson() {
        if (!authorRows.length) {
          updateAuthorStatus("ยังไม่มี draft สำหรับ export");
          return;
        }
        downloadTextFile(
          `${timestampForFilename()}-lexicore-writing-drafts.json`,
          "application/json;charset=utf-8",
          JSON.stringify(authorRows, null, 2)
        );
        updateAuthorStatus(`Export JSON แล้ว ${authorRows.length} ข้อ`);
      }

      function setFormValue(name, value) {
        const field = authoringForm.elements[name];
        if (field) field.value = value || "";
      }

      function loadAuthorRowIntoForm(questionId) {
        const row = authorRows.find(item => item.question_id === questionId);
        if (!row) {
          updateAuthorStatus("หา draft นี้ไม่เจอใน browser storage");
          return;
        }
        editingAuthorId = row.question_id;
        setFormValue("course_id", row.course_id || DEFAULT_COURSE_ID);
        setFormValue("level", row.level || "2");
        setFormValue("title", row.title || "");
        setFormValue("module", row.module || "");
        setFormValue("source", row.source || "");
        setFormValue("scenario", row.scenario || "");
        setFormValue("question", row.question || "");
        setFormValue("model_answer", row.model_answer || "");
        setFormValue("hints", [row.hint_1, row.hint_2, row.hint_3].filter(Boolean).join("\n"));
        selectedAuthorStatutes = normalizeAuthorStatutes(row.statutes);
        renderAuthorStatuteOptions(row.course_id || DEFAULT_COURSE_ID);
        syncSelectedAuthorStatutes();
        authorSubmitBtn.textContent = "บันทึกและ preview";
        document.getElementById("authoringBox").open = true;
        updateAuthorStatus("โหลด draft กลับมาแก้ไขแล้ว");
      }

      function startNewAuthorDraft() {
        editingAuthorId = null;
        authoringForm.reset();
        authorCourse.value = state.courseId;
        authorLevel.value = String(state.level || 2);
        selectedAuthorStatutes = [];
        renderAuthorStatuteOptions(authorCourse.value);
        syncSelectedAuthorStatutes();
        authorSubmitBtn.textContent = "เพิ่มและ preview";
        updateAuthorStatus("เริ่มข้อใหม่แล้ว");
      }

      function deleteAuthorDraft(questionId) {
        const rowIndex = authorRows.findIndex(item => item.question_id === questionId);
        if (rowIndex === -1) {
          updateAuthorStatus("หา draft นี้ไม่เจอใน browser storage");
          return;
        }
        const deletedTitle = authorRows[rowIndex].title || "draft";
        authorRows.splice(rowIndex, 1);
        saveAuthorRows();

        const questionIndex = questions.findIndex(item => item.id === questionId && item.authorDraft);
        if (questionIndex >= 0) {
          questions.splice(questionIndex, 1);
        }
        unmarkCompleted(questionId);

        if (editingAuthorId === questionId) {
          startNewAuthorDraft();
        }

        const filtered = visibleQuestions();
        state.index = Math.min(state.index, Math.max(filtered.length - 1, 0));
        resetQuestionState();
        updateAuthorStatus(`ลบ ${deletedTitle} แล้ว`);
        render();
      }

      function renderCourseTabs() {
        courseTabs.innerHTML = courseCatalog.map(course => {
          const count = questions.filter(q => q.courseId === course.id).length;
          return `
            <button class="course-tab ${state.courseId === course.id ? "active" : ""}" data-course-id="${course.id}">
              <strong>${course.code}</strong>
              <span>${course.title}</span>
              <small>${count ? `${count} ข้อ` : course.note}</small>
            </button>
          `;
        }).join("");
        courseTabs.querySelectorAll("button").forEach(button => {
          button.addEventListener("click", () => {
            state.courseId = button.dataset.courseId;
            state.level = firstAvailableLevel(state.courseId);
            state.index = 0;
            state.search = "";
            state.statusFilter = "all";
            questionSearch.value = "";
            resetQuestionState();
            render();
          });
        });
      }

      function renderLevelTabs() {
        levelTabs.innerHTML = [1, 2, 3].map(level => {
          const count = courseQuestions().filter(q => q.level === level).length;
          return `<button class="level-tab ${state.level === level ? "active" : ""}" data-level="${level}">Level ${level}<br><span class="small">${count} ข้อ</span></button>`;
        }).join("");
        levelTabs.querySelectorAll("button").forEach(button => {
          button.addEventListener("click", () => {
            state.level = Number(button.dataset.level);
            state.index = 0;
            resetQuestionState();
            render();
          });
        });
      }

      function renderList() {
        const filtered = visibleQuestions();
        if (!filtered.length) {
          list.innerHTML = `<div class="question-empty">ยังไม่มีคำถามในระดับนี้สำหรับวิชาที่เลือก</div>`;
          return;
        }
        list.innerHTML = filtered.map((q, i) => `
          <button class="question-tab ${i === state.index ? "active" : ""} ${isCompleted(q.id) ? "done" : ""}" data-index="${i}">
            <strong>ข้อ ${i + 1}</strong>
            <span>Level ${q.level} · ${q.module}${q.authorDraft ? " · เพิ่มเอง" : ""}</span>
            ${isCompleted(q.id) ? `<em class="done-badge">ทำแล้ว</em>` : ""}
          </button>
        `).join("");
        list.querySelectorAll("button").forEach(button => {
          button.addEventListener("click", () => {
            state.index = Number(button.dataset.index);
            resetQuestionState();
            render();
          });
        });
      }

      function resetQuestionState() {
        state.hintsUsed = 0;
        state.selected = {};
        state.matches = {};
        state.drops = {};
        state.answerShown = false;
      }

      function labelType(type) {
        return { mcq: "ปรนัย", matching: "จับคู่", drag_drop: "ลากวาง", subjective: "เขียนตอบ" }[type] || type;
      }

      function meta(q) {
        return `
          <div class="meta">
            <span class="pill">Level ${q.level}</span>
            <span class="pill">${labelType(q.type)}</span>
            <span class="pill">${q.module}</span>
            <span class="pill">${q.source}</span>
            ${q.authorDraft ? `<span class="pill">Draft</span>` : ""}
          </div>
          <div class="statute-row">
            <div class="statute-row-label">มาตราที่เกี่ยวข้อง</div>
            <div class="statute-buttons">${q.statutes.map(s => `<button class="statute-button" data-statute="${s}" type="button">${statuteButtonText(s)}</button>`).join("")}</div>
          </div>
          <div id="statuteInlineNote"></div>
        `;
      }

      function render() {
        const course = currentCourse();
        const totalInCourse = courseQuestions().length;
        const doneInCourse = courseQuestions().filter(q => isCompleted(q.id)).length;
        summary.textContent = `${course.code} ${course.title} · ${doneInCourse}/${totalInCourse} ข้อทำแล้ว`;
        statusFilters.querySelectorAll("button").forEach(button => {
          button.classList.toggle("active", button.dataset.statusFilter === state.statusFilter);
        });
        if (questionSearch.value !== state.search) {
          questionSearch.value = state.search;
        }
        renderCourseTabs();
        renderLevelTabs();
        renderList();
        const q = visibleQuestions()[state.index];
        if (!q) {
          panel.innerHTML = `
            <div class="empty-state">
              <h2>${course.code} ${course.title}</h2>
              <p>ยังไม่มีคำถามพร้อมใช้ใน Level ${state.level} สำหรับวิชานี้</p>
            </div>
          `;
          return;
        }
        panel.innerHTML = `
          ${meta(q)}
          <div class="reader-toolbar" aria-label="เครื่องมืออ่านคำถาม">
            <div class="reader-toolbar-group">
              <span class="reader-toolbar-label">ขนาดตัวอักษร</span>
              <button id="fontSmallerBtn" type="button" aria-label="ลดขนาดตัวอักษร">ก-</button>
              <button id="fontLargerBtn" type="button" aria-label="เพิ่มขนาดตัวอักษร">ก+</button>
            </div>
            <div class="reader-toolbar-group">
              <button id="highlightBtn" type="button">Highlight</button>
              <button id="clearHighlightBtn" type="button">ลบ highlight</button>
            </div>
          </div>
          <div class="reading-surface" id="readingSurface">
            <h2>${q.title}</h2>
            ${q.scenario ? `<div class="scenario">${q.scenario}</div>` : ""}
            <div class="question-text">${q.question}</div>
            <div id="answerArea">${renderAnswer(q)}</div>
            <div id="answerAreaReveal"></div>
          </div>
          <div class="controls">
            <button id="hintBtn">ขอคำใบ้ (${state.hintsUsed}/3)</button>
            <button class="primary" id="submitBtn">ส่งคำตอบ</button>
            ${q.type === "subjective" ? `<button id="answerBtn">ดูเฉลย</button>` : ""}
            ${q.authorDraft ? `<button id="editDraftBtn" type="button">แก้ไข draft</button>` : ""}
            ${q.authorDraft ? `<button id="deleteDraftBtn" type="button">ลบ draft</button>` : ""}
            <button id="resetBtn">เริ่มข้อนี้ใหม่</button>
          </div>
          <div id="hintArea"></div>
          <div id="resultArea"></div>
        `;
        bindAnswer(q);
        bindStatuteButtons(panel, q);
        bindReaderTools();
        document.getElementById("hintBtn").addEventListener("click", showHint);
        document.getElementById("submitBtn").addEventListener("click", submitAnswer);
        if (q.type === "subjective") {
          document.getElementById("answerBtn").addEventListener("click", () => showModelAnswer(q));
        }
        if (q.authorDraft) {
          document.getElementById("editDraftBtn").addEventListener("click", () => loadAuthorRowIntoForm(q.id));
          document.getElementById("deleteDraftBtn").addEventListener("click", () => deleteAuthorDraft(q.id));
        }
        document.getElementById("resetBtn").addEventListener("click", () => {
          unmarkCompleted(q.id);
          resetQuestionState();
          const remaining = visibleQuestions();
          state.index = Math.min(state.index, Math.max(remaining.length - 1, 0));
          render();
        });
      }

      function bindReaderTools() {
        applyFontSize();
        document.getElementById("fontSmallerBtn").addEventListener("click", () => {
          state.fontStep = Math.max(state.fontStep - 1, -1);
          applyFontSize();
        });
        document.getElementById("fontLargerBtn").addEventListener("click", () => {
          state.fontStep = Math.min(state.fontStep + 1, 2);
          applyFontSize();
        });
        document.getElementById("highlightBtn").addEventListener("click", highlightSelection);
        document.getElementById("clearHighlightBtn").addEventListener("click", clearHighlight);
      }

      function highlightSelection() {
        const surface = document.getElementById("readingSurface");
        const selection = window.getSelection();
        if (!surface || !selection || selection.rangeCount === 0 || selection.isCollapsed) return;
        const range = selection.getRangeAt(0);
        if (!surface.contains(range.commonAncestorContainer)) return;
        const highlight = document.createElement("span");
        highlight.className = "user-highlight";
        try {
          range.surroundContents(highlight);
        } catch (error) {
          const fragment = range.extractContents();
          highlight.appendChild(fragment);
          range.insertNode(highlight);
        }
        selection.removeAllRanges();
      }

      function unwrapHighlight(node) {
        const parent = node.parentNode;
        if (!parent) return;
        while (node.firstChild) parent.insertBefore(node.firstChild, node);
        parent.removeChild(node);
        parent.normalize();
      }

      function clearHighlight() {
        const surface = document.getElementById("readingSurface");
        if (!surface) return;
        const selection = window.getSelection();
        const selectedNode = selection && selection.rangeCount
          ? selection.getRangeAt(0).commonAncestorContainer
          : null;
        const selectedHighlight = selectedNode?.nodeType === Node.ELEMENT_NODE
          ? selectedNode.closest?.(".user-highlight")
          : selectedNode?.parentElement?.closest(".user-highlight");
        if (selectedHighlight && surface.contains(selectedHighlight)) {
          unwrapHighlight(selectedHighlight);
          selection.removeAllRanges();
          return;
        }
        surface.querySelectorAll(".user-highlight").forEach(unwrapHighlight);
      }

      function renderAnswer(q) {
        if (q.type === "mcq") {
          return `<div class="choices">${q.choices.map(c => `
            <label class="choice">
              <input type="radio" name="choice" value="${c.id}" />
              <span>${c.text}</span>
            </label>
          `).join("")}</div>`;
        }
        if (q.type === "matching") {
          return `<div class="matching">${q.pairs.map((p, i) => `
            <div class="match-row">
              <div>${p.prompt}</div>
              <select data-match="${i}">
                <option value="">เลือกคำตอบ</option>
                ${q.options.map(o => `<option value="${o}">${o}</option>`).join("")}
              </select>
            </div>
          `).join("")}</div>`;
        }
        if (q.type === "drag_drop") {
          return `
            <div class="drag-grid">
              <div>
                <h3>ข้อเท็จจริง</h3>
                ${q.dragItems.map(item => `<div class="drag-item" draggable="true" data-drag="${item.id}">${item.text}</div>`).join("")}
              </div>
              <div>
                <h3>องค์ประกอบ</h3>
                ${q.dropZones.map(zone => `<div class="drop-zone" data-drop="${zone.id}"><h3>${zone.label}</h3><div class="small">วางข้อเท็จจริงที่นี่</div></div>`).join("")}
              </div>
            </div>
          `;
        }
        return `<textarea id="subjectiveAnswer" placeholder="พิมพ์คำตอบแบบ หลักกฎหมาย -> วินิจฉัย/ปรับบท -> สรุป"></textarea>
          <p class="small">หน้านี้ใช้ตัวตรวจคำตอบแบบทดลองจาก keyword/rubric ในเครื่อง ยังไม่เรียก LLM API จริง</p>`;
      }

      function bindAnswer(q) {
        if (q.type === "matching") {
          panel.querySelectorAll("select[data-match]").forEach(select => {
            select.addEventListener("change", () => {
              state.matches[select.dataset.match] = select.value;
            });
          });
        }
        if (q.type === "drag_drop") {
          let dragged = null;
          panel.querySelectorAll("[data-drag]").forEach(item => {
            item.addEventListener("dragstart", () => { dragged = item.dataset.drag; });
          });
          panel.querySelectorAll("[data-drop]").forEach(zone => {
            zone.addEventListener("dragover", event => event.preventDefault());
            zone.addEventListener("drop", event => {
              event.preventDefault();
              if (!dragged) return;
              const item = q.dragItems.find(d => d.id === dragged);
              state.drops[dragged] = zone.dataset.drop;
              zone.querySelector(".small").textContent = item.text;
              panel.querySelector(`[data-drag="${dragged}"]`).classList.add("used");
            });
          });
        }
      }

      function showHint() {
        const q = visibleQuestions()[state.index];
        if (state.hintsUsed >= q.hints.length) return;
        state.hintsUsed += 1;
        document.getElementById("hintArea").innerHTML = `
          <div class="hint-box">
            <strong>Hint ${state.hintsUsed}</strong>
            <div>${q.hints[state.hintsUsed - 1]}</div>
            ${renderStatuteDetails(q)}
            <div class="small">ใช้ hint แล้ว โบนัสจำลองจะลดลง ${state.hintsUsed} คะแนน</div>
          </div>
        `;
        bindStatuteButtons(document.getElementById("hintArea"), q);
        document.getElementById("hintBtn").textContent = `ขอคำใบ้ (${state.hintsUsed}/3)`;
        if (state.hintsUsed >= 3) document.getElementById("hintBtn").disabled = true;
      }

      function submitAnswer() {
        const q = visibleQuestions()[state.index];
        let submitted = false;
        if (q.type === "mcq") submitted = gradeMcq(q);
        else if (q.type === "matching") submitted = gradeMatching(q);
        else if (q.type === "drag_drop") submitted = gradeDrag(q);
        else submitted = gradeSubjective(q);
        if (submitted) {
          markCompleted(q.id);
          if (state.statusFilter === "todo") {
            const remaining = visibleQuestions();
            state.index = Math.min(state.index, Math.max(remaining.length - 1, 0));
            resetQuestionState();
            render();
            return true;
          }
          renderList();
          const course = currentCourse();
          const totalInCourse = courseQuestions().length;
          const doneInCourse = courseQuestions().filter(question => isCompleted(question.id)).length;
          summary.textContent = `${course.code} ${course.title} · ${doneInCourse}/${totalInCourse} ข้อทำแล้ว`;
        }
        return submitted;
      }

      function renderStatuteDetails(q) {
        if (!q.statutes.length) return "";
        return `
          <details>
            <summary>เปิดดูตัวบทมาตราที่เกี่ยวข้อง</summary>
            <div class="statute-box">
              <div class="statute-buttons">${q.statutes.map(s => `<button class="statute-button" data-statute="${s}" type="button">${statuteButtonText(s)}</button>`).join("")}</div>
              <div id="hintStatuteNote" class="inline-statute-note">กดปุ่มมาตราเพื่อดูตัวบทและจุดที่ควรนำไปใช้ตอบ</div>
            </div>
          </details>
        `;
      }

      function renderStatuteShortNote(statute, courseId) {
        const entry = statuteEntry(statute, courseId);
        if (!entry) {
          return `<div class="inline-statute-note">ยังไม่มีคำย่อสำหรับมาตรานี้ในตัวทดลอง</div>`;
        }
        if (typeof entry === "string") {
          return `<div class="inline-statute-note"><strong>มาตรา ${statuteButtonText(statute)}</strong><br>${entry}</div>`;
        }
        return `
          <div class="inline-statute-note">
            <strong>มาตรา ${statuteButtonText(statute)}</strong><br>${entry.title}
          </div>
        `;
      }

      function renderStatuteLawNote(statute, courseId) {
        const entry = statuteEntry(statute, courseId);
        if (!entry) {
          return `<div class="inline-statute-note">ยังไม่มีตัวบทสำหรับมาตรานี้ในตัวทดลอง</div>`;
        }
        if (typeof entry === "string") {
          return `<div class="inline-statute-note"><strong>มาตรา ${statuteButtonText(statute)}</strong><br>${entry}</div>`;
        }
        const paragraphs = statuteContentForDisplay(entry, statute);
        return `
          <div class="inline-statute-note statute-law-text">
            <strong>มาตรา ${statuteButtonText(statute)}: ${entry.title}</strong>
            <blockquote>${paragraphs.map(paragraph => `<p>${paragraph}</p>`).join("")}</blockquote>
            <div class="statute-law-note">${entry.note}</div>
          </div>
        `;
      }

      function bindStatuteButtons(scope, q) {
        scope.querySelectorAll("[data-statute]").forEach(button => {
          button.addEventListener("click", () => {
            const statute = button.dataset.statute;
            scope.querySelectorAll("[data-statute]").forEach(b => b.classList.toggle("active", b.dataset.statute === statute));
            const localTarget = button.closest(".statute-box")?.querySelector("#hintStatuteNote");
            const pageTarget = document.getElementById("statuteInlineNote");
            const target = localTarget || pageTarget;
            if (target) {
              target.innerHTML = localTarget
                ? renderStatuteLawNote(statute, q?.courseId)
                : renderStatuteShortNote(statute, q?.courseId);
            }
          });
        });
      }

      function showModelAnswer(q) {
        const answer = q.modelAnswer || {
          source: "แนวเฉลยจาก rubric",
          steps: q.criteria.map(c => c.label),
          highlights: []
        };
        const answerContext = {
          ...answer,
          courseId: answer.courseId || q.courseId,
          statutes: answer.statutes || q.statutes
        };
        const paragraph = answerContext.paragraph || answerContext.steps.join(" ");
        const highlights = answer.highlights || [];
        document.getElementById("answerAreaReveal").innerHTML = `
          <div class="answer-box">
            <h3>แนวเฉลย</h3>
            <div class="answer-source">${answerContext.source}</div>
            ${highlights.length ? `<div class="key-points">${highlights.map(item => `<span class="key-point ${item.type}">${item.text}</span>`).join("")}</div>` : ""}
            <div class="model-paragraph">${formatModelAnswer(paragraph, answerContext.steps, answerContext)}</div>
            <details open>
              <summary>ดูโครงสร้างการตอบแบบเป็นขั้น</summary>
              <ol>${answerContext.steps.map(step => `<li>${cleanAnswerStep(step)}</li>`).join("")}</ol>
            </details>
          </div>
        `;
      }

      function normalizeModelAnswerText(text) {
        return String(text || "")
          .replace(/\s+(ต่อมา|นอกจากนี้|อย่างไรก็ดี|เมื่อ|ดังนั้น|หาก|แนวตอบจึงควรสรุปว่า)/g, "\n$1")
          .replace(/\s+(ประเด็นต้องแยก|ต้องเริ่มจากแยกว่า|ข้อเท็จจริงเป็น|หนึ่งครอบครอง|โจทย์นี้ต้องแยก)/g, "\n$1")
          .trim();
      }

      function stripAnswerStepLabel(text) {
        return cleanAnswerStep(text)
          .replace(/^(?:หลักกฎหมาย|วินิจฉัย\/ปรับบท|วินิจฉัย|ปรับบท|สรุป|Rule|Application|Conclusion)\s*[:：-]?\s*/iu, "")
          .trim();
      }

      function sectionHtml(title, text) {
        return `
          <section class="model-answer-section">
            <h4>${title}</h4>
            ${formatModelParagraph(text)}
          </section>
        `;
      }

      function splitModelAnswerLawBlock(paragraph) {
        const text = String(paragraph || "");
        const marker = "ตัวบทมาตราเต็ม:";
        const markerIndex = text.indexOf(marker);
        if (markerIndex === -1) {
          return {
            answerText: text,
            lawBlock: ""
          };
        }
        return {
          answerText: text.slice(0, markerIndex).trim(),
          lawBlock: text.slice(markerIndex).trim()
        };
      }

      function statuteLawBlockForAnswer(answerContext, existingLawBlock) {
        const statutes = answerContext.statutes || [];
        const entries = statutes
          .map(statute => {
            const entry = statuteEntry(statute, answerContext.courseId);
            if (!entry || typeof entry === "string" || isPlaceholderStatuteText(entry.text)) return "";
            const text = statuteContentForDisplay(entry, statute).join("\n");
            return `มาตรา ${statuteButtonText(statute)}: ${entry.title}\n${text}`;
          })
          .filter(Boolean);

        if (!entries.length) return existingLawBlock;
        return `ตัวบทมาตราเต็ม:\n${entries.join("\n\n")}`;
      }

      function formatModelAnswer(paragraph, steps = [], answerContext = {}) {
        const { answerText, lawBlock } = splitModelAnswerLawBlock(paragraph);
        const fullLawBlock = statuteLawBlockForAnswer(answerContext, lawBlock);
        const sections = {
          law: [],
          application: []
        };

        steps.map(cleanAnswerStep).filter(Boolean).forEach(step => {
          const plainStep = stripAnswerStepLabel(step);
          if (/^(?:หลักกฎหมาย|Rule\b|มาตรา|หลัก\s)/u.test(step)) {
            if (plainStep) sections.law.push(plainStep);
          } else if (/^(?:สรุป|Conclusion\b)|ดังนั้น|จึง/u.test(step)) {
            if (plainStep) sections.application.push(plainStep);
          } else if (/^(?:วินิจฉัย\/ปรับบท|วินิจฉัย|ปรับบท|Application\b)|เมื่อนำ|เมื่อ|ระหว่าง|ข้อเท็จจริง/u.test(step)) {
            if (plainStep) sections.application.push(plainStep);
          }
        });

        if (sections.law.length || sections.application.length || fullLawBlock) {
          const fallbackText = normalizeModelAnswerText(answerText);
          const lawText = [sections.law.join(" ").trim() || "พิจารณาหลักกฎหมายและมาตราที่เกี่ยวข้องตามโจทย์", fullLawBlock]
            .filter(Boolean)
            .join("\n\n");
          const applicationText = sections.application.join(" ").trim() || fallbackText;
          return [
            sectionHtml("หลักกฎหมาย", lawText),
            sectionHtml("วินิจฉัย/ปรับบท", applicationText)
          ].join("");
        }

        return [
          sectionHtml("หลักกฎหมาย", "พิจารณาหลักกฎหมายและมาตราที่เกี่ยวข้องตามโจทย์"),
          sectionHtml("วินิจฉัย/ปรับบท", answerText)
        ].join("");
      }

      function formatModelParagraph(paragraph) {
        const text = normalizeModelAnswerText(paragraph);
        const parts = text
          .split(/\n+/)
          .map(part => part.trim())
          .filter(Boolean);
        return parts.map(part => `<p>${part}</p>`).join("");
      }

      function renderResult({ score, max, title, lines, good }) {
        const hintPenalty = state.hintsUsed;
        const finalScore = Math.max(0, score - hintPenalty);
        document.getElementById("resultArea").innerHTML = `
          <div class="result ${good ? "good" : "bad"}">
            <div class="score">${finalScore}/${max}</div>
            <strong>${title}</strong>
            <ul class="feedback-list">${lines.map(line => `<li>${line}</li>`).join("")}</ul>
            <p class="small">คะแนนนี้หัก hint penalty แล้ว ${hintPenalty} คะแนน</p>
          </div>
        `;
      }

      function gradeMcq(q) {
        const selected = panel.querySelector("input[name='choice']:checked");
        if (!selected) {
          renderResult({ score: 0, max: 1, title: "ยังไม่ได้เลือกคำตอบ", lines: ["เลือกตัวเลือกก่อนส่งคำตอบ"], good: false });
          return false;
        }
        const choice = q.choices.find(c => c.id === selected.value);
        renderResult({
          score: choice.correct ? 1 : 0,
          max: 1,
          title: choice.correct ? "ถูกต้อง" : "ยังคลาดเคลื่อน",
          lines: [choice.rationale],
          good: choice.correct
        });
        return true;
      }

      function gradeMatching(q) {
        let correct = 0;
        const lines = q.pairs.map((p, i) => {
          const answer = state.matches[i] || "";
          const ok = answer === p.answer;
          if (ok) correct += 1;
          return `${ok ? "ถูก" : "ผิด"}: ${p.prompt} -> คำตอบที่ถูกคือ ${p.answer}`;
        });
        renderResult({ score: correct, max: q.pairs.length, title: "ผลการจับคู่", lines, good: correct === q.pairs.length });
        return true;
      }

      function gradeDrag(q) {
        let correct = 0;
        const lines = q.dragItems.map(item => {
          const expected = q.mapping[item.id];
          const actual = state.drops[item.id];
          const zone = q.dropZones.find(z => z.id === expected);
          const ok = actual === expected;
          if (ok) correct += 1;
          return `${ok ? "ถูก" : "ผิด"}: ${item.text} -> ${zone.label}`;
        });
        renderResult({ score: correct, max: q.dragItems.length, title: "ผลการลากวาง", lines, good: correct === q.dragItems.length });
        return true;
      }

      function gradeSubjective(q) {
        const answer = (document.getElementById("subjectiveAnswer").value || "").toLowerCase();
        if (answer.trim().length < 20) {
          renderResult({ score: 0, max: q.criteria.reduce((a, c) => a + c.points, 0), title: "คำตอบยังสั้นเกินไป", lines: ["ลองเขียนให้ครบหลักกฎหมาย วินิจฉัย/ปรับบท และสรุป"], good: false });
          return false;
        }
        let score = 0;
        const lines = q.criteria.map(c => {
          const hits = c.keywords.filter(k => answer.includes(k.toLowerCase())).length;
          const earned = hits >= 2 ? c.points : hits === 1 ? Math.ceil(c.points / 2) : 0;
          score += earned;
          return `${earned > 0 ? "พบ" : "ยังไม่พบ"}: ${c.label} (${earned}/${c.points})`;
        });
        const max = q.criteria.reduce((a, c) => a + c.points, 0);
        lines.push("คำแนะนำ: ตัวทดลองนี้ใช้ keyword/rubric แบบ local สำหรับลอง flow เท่านั้น เมื่อต่อ backend แล้วควรส่ง scenario, gold standard, rubric และคำตอบไปให้ LLM ตรวจเป็น JSON");
        renderResult({ score, max, title: "ผลประเมินแบบทดลอง", lines, good: score >= Math.ceil(max * 0.6) });
        return true;
      }

      bindTools();
      render();
    </script>
  </body>
</html>
