id: q-15-unregistered-real-right-third-party
course_id: 41215
module_id: module-02-property
level: 3
type: subjective
title: ทรัพยสิทธิที่ยังไม่จดทะเบียนกับบุคคลภายนอก
source:
  unit: 15
  file: source-materials/raw/41215-15.pdf
scenario: >
  นาย ก. เจ้าของที่ดินทำสัญญาเป็นหนังสือให้นาย ข. มีสิทธิเหนือพื้นดินเพื่อสร้างอาคารบนที่ดิน แต่ยังไม่ได้จดทะเบียน ต่อมานาย ก. โอนขายที่ดินให้นาย ค. ซึ่งตรวจทะเบียนแล้วไม่พบสิทธิดังกล่าว นาย ข. สร้างอาคารไปบางส่วนและต้องการอ้างสิทธิเหนือพื้นดินต่อ นาย ค.
question: ให้วินิจฉัยผลของการได้มาซึ่งทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์ที่ยังไม่จดทะเบียน ผลระหว่างคู่กรณี ผลต่อบุคคลภายนอก และแนวทางเยียวยาที่ควรพิจารณา
statutes: ["1299", "1410", "420"]
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้เกี่ยวกับการได้มาซึ่งทรัพยสิทธิอันเกี่ยวกับอสังหาริมทรัพย์และผลต่อบุคคลภายนอก
  - level: 2
    kind: key_elements
    text: แยกผลระหว่างนาย ก. กับนาย ข. ออกจากผลที่นาย ข. จะอ้างต่อ นาย ค.
  - level: 3
    kind: statute_number
    text: พิจารณามาตรา 1299 และสิทธิเหนือพื้นดินตามมาตรา 1410
rubric_id: r-15-unregistered-real-right-third-party

