id: q-property-servitude-adverse-tort
course_id: 41215
module_id: module-02-property
level: 3
type: subjective
title: ครอบครองปรปักษ์ ภาระจำยอม และละเมิดในที่ดิน
scenario: >
  นาย ก. ใช้ที่ดินของนาย ข. เป็นทางผ่านเข้าออกที่ดินของตนมาเป็นเวลานานโดยเปิดเผย ต่อมานาย ก. สร้างรั้วล้ำเข้าไปในที่ดินนาย ข. และรถของนาย ก. ชนกำแพงในที่ดินนั้นเสียหาย นาย ข. ฟ้องให้นาย ก. รื้อรั้วและชดใช้ค่าเสียหาย แต่นาย ก. อ้างว่าตนได้สิทธิจากการใช้ทางและการครอบครอง
question: ให้วินิจฉัยประเด็นเรื่องภาระจำยอม ทางจำเป็น/การใช้ทาง การครอบครองปรปักษ์ และความรับผิดจากการทำให้ทรัพย์เสียหาย โดยเรียงลำดับมาตราที่เกี่ยวข้อง
statutes: ["1299", "1349", "1382", "1387", "420"]
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้มีทั้งทรัพยสิทธิในที่ดิน การใช้ทาง และความรับผิดจากความเสียหาย
  - level: 2
    kind: key_elements
    text: แยกการใช้ทาง ภาระจำยอม ทางจำเป็น ครอบครองปรปักษ์ และละเมิดออกจากกัน
  - level: 3
    kind: statute_number
    text: พิจารณามาตรา 1299, 1349, 1382, 1387 และ 420
rubric_id: r-property-servitude-adverse-tort

