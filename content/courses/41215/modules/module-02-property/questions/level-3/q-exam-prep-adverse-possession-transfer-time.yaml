scenario: >
  หนึ่งเข้าทำกินในที่ดินมีโฉนดของสองโดยเข้าใจว่าเป็นที่ดินรกร้างว่างเปล่าเป็นเวลา 4 ปี ต่อมาหนึ่งขายที่ดินนั้นให้สามโดยสามไม่ทราบความเป็นมา และสามทำกินต่ออีก 7 ปี
question: "ให้วินิจฉัยว่าสามมีข้อต่อสู้ว่าได้กรรมสิทธิ์โดยครอบครองปรปักษ์หรือไม่ และนับเวลาครอบครองของหนึ่งรวมกับของสามได้หรือไม่"
