title: จับคู่ทรัพยสิทธิอื่น
source:
  unit: 14
  file: source-materials/raw/41215-14.pdf
scenario: จับคู่ลักษณะสิทธิกับชื่อทรัพยสิทธิ
question: เลือกชื่อสิทธิที่ตรงกับลักษณะมากที่สุด
statutes: ["1402", "1410", "1417", "1387"]
pairs:
  - prompt: สิทธิอยู่อาศัยในโรงเรือนของผู้อื่น
    answer: สิทธิอาศัย
  - prompt: สิทธิเป็นเจ้าของโรงเรือนหรือสิ่งปลูกสร้างบนที่ดินของผู้อื่น
    answer: สิทธิเหนือพื้นดิน
  - prompt: สิทธิใช้และถือเอาประโยชน์จากอสังหาริมทรัพย์ของผู้อื่น
    answer: สิทธิเก็บกิน
  - prompt: อสังหาริมทรัพย์หนึ่งต้องรับกรรมเพื่อประโยชน์แก่อสังหาริมทรัพย์อื่น
    answer: ภาระจำยอม
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้เกี่ยวกับทรัพยสิทธิอื่นที่จำกัดกรรมสิทธิ์
  - level: 2
    kind: key_elements
    text: แยกว่าเป็นสิทธิอยู่อาศัย สิ่งปลูกสร้าง ใช้ประโยชน์ หรือรับกรรมเพื่อที่ดินอื่น
  - level: 3
    kind: statute_number
    text: เปรียบเทียบมาตรา 1402, 1410, 1417 และ 1387

