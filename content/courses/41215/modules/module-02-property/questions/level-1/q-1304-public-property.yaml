id: q-1304-public-property
course_id: 41215
module_id: module-02-property
level: 1
type: mcq
title: สาธารณสมบัติของแผ่นดิน
scenario: เลือกข้อความที่สะท้อนหลักการจำแนกสาธารณสมบัติของแผ่นดินตามมาตรา 1304 ได้เหมาะสมที่สุด
question: ข้อใดกล่าวถูกต้อง
statutes: ["1304"]
choices:
  - id: a
    text: ทรัพย์สินทุกชนิดที่รัฐเป็นเจ้าของถือเป็นสาธารณสมบัติของแผ่นดินเสมอ
    is_correct: false
    misconception: สับสนระหว่างทรัพย์สินของรัฐทั่วไปกับสาธารณสมบัติของแผ่นดิน
    rationale: ต้องพิจารณาว่าทรัพย์นั้นใช้เพื่อสาธารณประโยชน์หรือสงวนไว้เพื่อประโยชน์ร่วมกันหรือไม่
  - id: b
    text: ต้องพิจารณาลักษณะทรัพย์และวัตถุประสงค์การใช้เพื่อสาธารณประโยชน์หรือประโยชน์ร่วมกัน
    is_correct: true
    rationale: คำตอบนี้ตรงกับแนวคิดหลักของการจำแนกตามมาตรา 1304
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้เกี่ยวกับทรัพย์สินของแผ่นดิน
  - level: 2
    kind: key_elements
    text: มองหาว่าทรัพย์นั้นมีวัตถุประสงค์เพื่อสาธารณประโยชน์หรือประโยชน์ร่วมกันหรือไม่
  - level: 3
    kind: statute_number
    text: พิจารณาประมวลกฎหมายแพ่งและพาณิชย์ มาตรา 1304

