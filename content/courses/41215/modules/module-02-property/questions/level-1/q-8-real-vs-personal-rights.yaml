title: แยกทรัพยสิทธิกับบุคคลสิทธิ
source:
  unit: 8
  file: source-materials/raw/41215-8.pdf
scenario: จับคู่ข้อความกับประเภทสิทธิที่เหมาะสม
question: ข้อความใดเป็นทรัพยสิทธิหรือบุคคลสิทธิ
statutes: ["1299"]
pairs:
  - prompt: สิทธิเหนือทรัพย์ที่อาจใช้ยันบุคคลทั่วไปได้เมื่อก่อตั้งถูกต้อง
    answer: ทรัพยสิทธิ
  - prompt: สิทธิเรียกร้องให้คู่สัญญาชำระหนี้หรือปฏิบัติตามสัญญา
    answer: บุคคลสิทธิ
  - prompt: สิทธิอาศัยหรือภาระจำยอมที่เป็นสิทธิเกี่ยวกับอสังหาริมทรัพย์
    answer: ทรัพยสิทธิ
  - prompt: สิทธิของผู้เช่าที่เรียกร้องต่อผู้ให้เช่าตามสัญญาเช่า
    answer: บุคคลสิทธิ
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้ฝึกแยกประเภทสิทธิตามวัตถุแห่งสิทธิ
  - level: 2
    kind: key_elements
    text: ทรัพยสิทธิมุ่งสิทธิเหนือทรัพย์ ส่วนบุคคลสิทธิมุ่งสิทธิเรียกร้องต่อบุคคล
  - level: 3
    kind: statute_number
    text: เชื่อมกับหลักทรัพยสิทธิและผลของมาตรา 1299 เมื่อต้องจดทะเบียน

