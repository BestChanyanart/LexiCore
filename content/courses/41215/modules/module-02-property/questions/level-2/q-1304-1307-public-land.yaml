id: q-1304-1307-public-land
course_id: 41215
module_id: module-02-property
level: 2
type: subjective
title: เอกชนอ้างสิทธิในทางสาธารณะ
scenario: >
  ชาวบ้านใช้ทางริมคลองเป็นทางสัญจรมานาน ต่อมานาย ก. ล้อมรั้วปิดทางและอ้างว่าตนครอบครองพื้นที่นั้นมานานจนได้สิทธิ
question: ให้วินิจฉัยว่าควรพิจารณาหลักสาธารณสมบัติของแผ่นดินและผลเรื่องการอ้างสิทธิอย่างไร
statutes: ["1304", "1306", "1307"]
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้เกี่ยวกับทรัพย์สินของแผ่นดินที่ประชาชนใช้ร่วมกัน
  - level: 2
    kind: key_elements
    text: ตรวจว่าเป็นสาธารณสมบัติของแผ่นดินหรือไม่ และเอกชนอ้างอายุความหรือครอบครองปรปักษ์ได้หรือไม่
  - level: 3
    kind: statute_number
    text: พิจารณามาตรา 1304, 1306 และ 1307
rubric_id: r-1304-1307-public-property

