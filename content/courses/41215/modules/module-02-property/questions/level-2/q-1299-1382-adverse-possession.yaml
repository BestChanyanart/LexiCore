id: q-1299-1382-adverse-possession
course_id: 41215
module_id: module-02-property
level: 2
type: subjective
title: ครอบครองปรปักษ์กับการได้มาซึ่งกรรมสิทธิ์
scenario: >
  นาย ก. เข้าใช้ที่ดินของนาย ข. โดยเปิดเผย ปลูกบ้านและแสดงตนเป็นเจ้าของต่อเนื่องเป็นเวลานาน นาย ข. ไม่เคยคัดค้านจนเกิดข้อพิพาทเรื่องกรรมสิทธิ์
question: ให้วินิจฉัยว่านาย ก. อาจอ้างการได้กรรมสิทธิ์โดยครอบครองปรปักษ์ได้หรือไม่ และต้องเชื่อมโยงกับหลักการได้มาซึ่งทรัพยสิทธิอย่างไร
statutes: ["1299", "1382"]
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้เกี่ยวกับการได้มาซึ่งกรรมสิทธิ์ในอสังหาริมทรัพย์
  - level: 2
    kind: key_elements
    text: มองหาการครอบครองโดยสงบ เปิดเผย เจตนาเป็นเจ้าของ และระยะเวลา
  - level: 3
    kind: statute_number
    text: พิจารณามาตรา 1382 ประกอบมาตรา 1299
rubric_id: r-1299-1382-adverse-possession

