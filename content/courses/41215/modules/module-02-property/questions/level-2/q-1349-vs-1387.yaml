id: q-1349-vs-1387
course_id: 41215
module_id: module-02-property
level: 2
type: subjective
title: ทางจำเป็นหรือภาระจำยอม
scenario: >
  นาย ก. ซื้อที่ดินแปลงหนึ่งซึ่งไม่มีทางออกสู่ทางสาธารณะ เว้นแต่ต้องผ่านที่ดินของนาย ข. นาย ก. ต้องการใช้ทางผ่านเท่าที่จำเป็นเพื่อออกสู่ถนน
question: ให้วินิจฉัยว่าข้อเท็จจริงนี้ควรพิจารณาตามหลักทางจำเป็นหรือภาระจำยอม
statutes: ["1349", "1387"]
hints:
  - level: 1
    kind: focus_area
    text: ข้อเท็จจริงนี้เกี่ยวกับข้อจำกัดสิทธิของเจ้าของอสังหาริมทรัพย์
  - level: 2
    kind: key_elements
    text: มองหาว่าที่ดินถูกล้อมจนไม่มีทางออกสู่ทางสาธารณะหรือเป็นสิทธิที่ตั้งขึ้นเพื่อประโยชน์แก่อสังหาริมทรัพย์อื่น
  - level: 3
    kind: statute_number
    text: เปรียบเทียบมาตรา 1349 เรื่องทางจำเป็นกับมาตรา 1387 เรื่องภาระจำยอม
rubric_id: r-1349-vs-1387

