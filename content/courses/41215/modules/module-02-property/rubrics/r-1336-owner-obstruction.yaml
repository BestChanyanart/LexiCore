id: r-1336-owner-obstruction
title: Rubric อำนาจเจ้าของกรรมสิทธิ์กรณีมีผู้สอดเข้าเกี่ยวข้อง
max_score: 10
gold_standard:
  statutes: ["1336", "420"]
  issues:
    - นาย ก. มีอำนาจในฐานะเจ้าของกรรมสิทธิ์อย่างไร
    - การวางวัสดุโดยไม่ได้รับอนุญาตก่อให้เกิดการเยียวยาหรือไม่
  rule_summary: เจ้าของมีอำนาจใช้สอย จำหน่าย ได้ดอกผล ติดตามเอาคืน และขัดขวางมิให้ผู้อื่นสอดเข้าเกี่ยวข้องโดยมิชอบ ทั้งอาจมีประเด็นละเมิดหากเกิดความเสียหาย
  expected_application:
    - นาย ก. เป็นเจ้าของที่ดิน
    - นาย ข. นำวัสดุมาวางโดยไม่ได้รับอนุญาต เป็นการสอดเข้าเกี่ยวข้องกับทรัพย์
    - นาย ก. อาจขอให้ขนย้ายออก
    - หากพิสูจน์ความเสียหายจากการใช้พื้นที่ อาจเชื่อมกับการเรียกค่าเสียหาย
  expected_conclusion: นาย ก. มีอำนาจขัดขวางและเรียกร้องให้ยุติการรบกวน พร้อมพิจารณาค่าเสียหายตามข้อเท็จจริง
