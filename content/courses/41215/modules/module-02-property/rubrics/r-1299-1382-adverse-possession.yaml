id: r-1299-1382-adverse-possession
title: Rubric ครอบครองปรปักษ์และการได้มาซึ่งกรรมสิทธิ์
max_score: 10
gold_standard:
  statutes: ["1299", "1382"]
  issues:
    - ผู้ครอบครองอาจได้กรรมสิทธิ์โดยครอบครองปรปักษ์หรือไม่
    - ต้องเชื่อมโยงกับหลักการได้มาซึ่งทรัพยสิทธิอย่างไร
  rule_summary: ต้องพิจารณาการครอบครองทรัพย์ของผู้อื่นโดยสงบ เปิดเผย เจตนาเป็นเจ้าของ และครบระยะเวลาตามกฎหมาย พร้อมเชื่อมกับผลทางทรัพยสิทธิ
  expected_application:
    - นาย ก. เข้าใช้ที่ดินของนาย ข. โดยเปิดเผย
    - มีพฤติการณ์ปลูกบ้านและแสดงตนเป็นเจ้าของ
    - ต้องตรวจระยะเวลาและลักษณะการครอบครองให้ครบองค์ประกอบ
  expected_conclusion: นาย ก. อาจอ้างครอบครองปรปักษ์ได้หากครบองค์ประกอบและระยะเวลาตามกฎหมาย
criteria:
  - id: issue
    label: จับประเด็นครอบครองปรปักษ์และทรัพยสิทธิ
    points: 2
  - id: rule
    label: ระบุองค์ประกอบมาตรา 1382 และเชื่อมมาตรา 1299
    points: 3
  - id: application
    label: ปรับข้อเท็จจริงครบองค์ประกอบ
    points: 4
  - id: conclusion
    label: สรุปผลถูกต้อง
    points: 1

