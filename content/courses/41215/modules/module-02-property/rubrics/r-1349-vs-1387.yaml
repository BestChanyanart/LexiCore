id: r-1349-vs-1387
title: Rubric เปรียบเทียบทางจำเป็นและภาระจำยอม
max_score: 10
gold_standard:
  statutes: ["1349", "1387"]
  issues:
    - ข้อเท็จจริงเป็นกรณีทางจำเป็นหรือภาระจำยอม
  rule_summary: ทางจำเป็นมุ่งกรณีที่ดินไม่มีทางออกสู่ทางสาธารณะ ส่วนภาระจำยอมเป็นทรัพยสิทธิที่อสังหาริมทรัพย์หนึ่งต้องรับกรรมบางอย่างเพื่อประโยชน์แก่อสังหาริมทรัพย์อื่น
  expected_application:
    - ที่ดินของนาย ก. ไม่มีทางออกสู่ทางสาธารณะ
    - การผ่านที่ดินนาย ข. เป็นการผ่านเท่าที่จำเป็นเพื่อออกสู่ถนน
    - ข้อเท็จจริงยังไม่ชี้ว่ามีการตั้งภาระจำยอมเป็นทรัพยสิทธิไว้ก่อน
  expected_conclusion: ควรพิจารณาเป็นกรณีทางจำเป็นตามมาตรา 1349 เป็นหลัก ไม่ใช่ภาระจำยอมตามมาตรา 1387
criteria:
  - id: issue
    label: จับประเด็นเปรียบเทียบทางจำเป็นและภาระจำยอม
    points: 2
  - id: rule
    label: อธิบายหลักมาตรา 1349 และ 1387 ได้ถูกต้อง
    points: 3
  - id: application
    label: ปรับข้อเท็จจริงเข้ากับความไม่มีทางออกและความจำเป็น
    points: 4
  - id: conclusion
    label: สรุปว่าเป็นทางจำเป็นได้สอดคล้องกับข้อเท็จจริง
    points: 1

