id: r-1356-co-owner-exclusive-use
title: Rubric กรรมสิทธิ์รวมกรณีเจ้าของรวมใช้ทรัพย์ฝ่ายเดียว
max_score: 10
gold_standard:
  statutes: ["1356", "1360", "1364"]
  issues:
    - เจ้าของรวมคนหนึ่งใช้ทรัพย์แต่เพียงผู้เดียวได้หรือไม่
    - เจ้าของรวมอีกคนมีทางเลือกทางกฎหมายใด
  rule_summary: กรรมสิทธิ์รวมทำให้เจ้าของรวมแต่ละคนมีสิทธิในทรัพย์ร่วมกัน การใช้ทรัพย์ต้องไม่ตัดสิทธิของเจ้าของรวมอื่น และอาจนำไปสู่การเรียกแบ่งทรัพย์หรือเยียวยา
  expected_application:
    - นาย ก. และนาย ข. เป็นเจ้าของรวม
    - นาย ก. เปลี่ยนกุญแจและกันนาย ข. ออกจากการใช้ทรัพย์
    - พฤติการณ์นี้กระทบสิทธิของเจ้าของรวมอีกคน
    - หากใช้ร่วมกันไม่ได้ อาจพิจารณาการแบ่งทรัพย์หรือทางเยียวยาอื่น
  expected_conclusion: นาย ข. ควรอ้างสิทธิในฐานะเจ้าของรวมและขอให้หยุดการใช้ฝ่ายเดียวหรือดำเนินทางออกเรื่องทรัพย์รวม
criteria:
  - id: co_ownership
    label: ระบุสถานะกรรมสิทธิ์รวม
    points: 2
  - id: use_conflict
    label: วิเคราะห์การใช้ทรัพย์ที่ตัดสิทธิผู้อื่น
    points: 4
  - id: remedies
    label: เสนอทางออกหรือการแบ่งทรัพย์
    points: 3
  - id: conclusion
    label: สรุปผลถูกต้อง
    points: 1

