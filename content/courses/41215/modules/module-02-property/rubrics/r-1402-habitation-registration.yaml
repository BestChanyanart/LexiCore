id: r-1402-habitation-registration
title: Rubric สิทธิอาศัยและผลของการไม่จดทะเบียน
max_score: 10
gold_standard:
  statutes: ["1299", "1402"]
  issues:
    - สิทธิอาศัยของนาย ข. เกิดผลอย่างไร
    - นาย ข. อ้างสิทธิต่อบุคคลภายนอกผู้รับโอนบ้านได้หรือไม่
  rule_summary: สิทธิอาศัยเป็นทรัพยสิทธิเกี่ยวกับอสังหาริมทรัพย์ การได้มาที่ต้องทำตามแบบและจดทะเบียนจึงมีผลสำคัญต่อความบริบูรณ์และการอ้างต่อบุคคลภายนอก
  expected_application:
    - นาย ก. ทำหนังสือให้นาย ข. อยู่อาศัยตลอดชีวิต
    - ยังไม่ได้จดทะเบียน จึงต้องแยกผลระหว่างคู่กรณีกับผลต่อ นาย ค.
    - นาย ค. เป็นผู้รับโอนบ้านภายหลัง จึงต้องวิเคราะห์ผลต่อบุคคลภายนอก
  expected_conclusion: นาย ข. อาจมีข้อเรียกร้องต่อ นาย ก. ตามนิติสัมพันธ์เดิม แต่การอ้างทรัพยสิทธิต่อ นาย ค. มีปัญหาเพราะยังไม่ได้จดทะเบียน
criteria:
  - id: habitation
    label: ระบุสิทธิอาศัยตามมาตรา 1402
    points: 2
  - id: registration
    label: วิเคราะห์ผลของการจดทะเบียนตามมาตรา 1299
    points: 4
  - id: third_party
    label: แยกผลต่อบุคคลภายนอก
    points: 3
  - id: conclusion
    label: สรุปผลถูกต้อง
    points: 1

