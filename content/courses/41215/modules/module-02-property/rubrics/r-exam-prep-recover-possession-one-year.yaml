    label: จับประเด็นข้อกฎหมายจากโจทย์ได้ถูกต้อง
    points: 2
    expected: "โฟกัสการถูกแย่งการครอบครอง"
  - id: rule
    label: ระบุมาตราที่เกี่ยวข้องและหลักกฎหมาย
    points: 3
    expected: "ควรกล่าวถึง 1375"
  - id: application
    label: ปรับข้อเท็จจริงเข้ากับองค์ประกอบกฎหมาย
    points: 3
    expected: "ระบุการแย่งการครอบครอง | อธิบายสิทธิเอาคืนการครอบครองและกำหนดหนึ่งปี | ปรับข้อเท็จจริงว่าเวลาผ่านกว่า 10 ปี | สรุปว่านาย ก. มีข้อต่อสู้"
  - id: conclusion
    label: สรุปผลทางกฎหมายให้ชัดเจน
    points: 2
    expected: "การที่นาย ก. เข้าไปครอบครองที่ดินมือเปล่าของนาย ข. เป็นการแย่งการครอบครองโดยมิชอบ แต่การฟ้องคดีเพื่อเอาคืนการครอบครองต้องฟ้องภายในหนึ่งปีนับแต่เวลาถูกแย่งการครอบครอง เมื่อเวลาผ่านไปกว่า 10 ปี นาย ข. จึงพ้นกำหนดฟ้องเอาคืนการครอบครอง นาย ก. จึงมีข้อต่อสู้ตามมาตรา 1375 วรรคสองได้"
