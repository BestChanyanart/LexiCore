id: r-property-servitude-adverse-tort
title: Rubric โจทย์ทรัพย์สินซับซ้อน ภาระจำยอม ครอบครองปรปักษ์ และละเมิด
max_score: 20
gold_standard:
  statutes: ["1299", "1349", "1382", "1387", "420"]
  issues:
    - นาย ก. มีสิทธิใช้ทางในที่ดินของนาย ข. หรือไม่
    - เป็นภาระจำยอม ทางจำเป็น หรือการใช้ทางโดยข้อเท็จจริง
    - นาย ก. อ้างครอบครองปรปักษ์ได้หรือไม่
    - นาย ก. ต้องรับผิดจากการทำให้ทรัพย์เสียหายหรือไม่
  rule_summary: ต้องแยกทรัพยสิทธิในที่ดิน การใช้ทาง ภาระจำยอม ทางจำเป็น การครอบครองปรปักษ์ และละเมิดออกจากกัน
  expected_application:
    - การใช้ทางนานโดยเปิดเผยยังต้องตรวจว่าเกิดภาระจำยอมหรือมีการจดทะเบียน/ฐานทางกฎหมายใด
    - ทางจำเป็นต้องตรวจว่าที่ดินไม่มีทางออกสู่ทางสาธารณะหรือไม่
    - ครอบครองปรปักษ์ต้องตรวจเจตนาเป็นเจ้าของและระยะเวลา ไม่ใช่เพียงใช้ทาง
    - การสร้างรั้วล้ำและขับรถชนกำแพงอาจเป็นละเมิดหากครบองค์ประกอบ
  expected_conclusion: ควรแยกวินิจฉัยแต่ละสิทธิและความรับผิด ไม่สรุปรวมว่าการใช้ทางนานทำให้ได้สิทธิทุกประเภท
criteria:
  - id: issue_spotting
    label: จับประเด็นทรัพยสิทธิและละเมิดครบ
    points: 4
  - id: rule_selection
    label: เลือกมาตราที่เกี่ยวข้องเหมาะสม
    points: 4
  - id: servitude_necessary_way
    label: แยกภาระจำยอมและทางจำเป็น
    points: 4
  - id: adverse_possession
    label: วิเคราะห์ครอบครองปรปักษ์อย่างถูกต้อง
    points: 4
  - id: tort_application
    label: วิเคราะห์ความรับผิดจากความเสียหายต่อทรัพย์
    points: 2
  - id: conclusion
    label: สรุปแยกประเด็นชัดเจน
    points: 2

