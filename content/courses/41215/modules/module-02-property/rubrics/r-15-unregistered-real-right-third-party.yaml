id: r-15-unregistered-real-right-third-party
title: Rubric ทรัพยสิทธิอสังหาริมทรัพย์ที่ยังไม่จดทะเบียนกับบุคคลภายนอก
max_score: 20
gold_standard:
  statutes: ["1299", "1410", "420"]
  issues:
    - นาย ข. ได้สิทธิเหนือพื้นดินที่สมบูรณ์เป็นทรัพยสิทธิหรือไม่
    - นาย ข. อ้างสิทธินั้นต่อ นาย ค. ผู้รับโอนได้หรือไม่
    - นาย ข. มีทางเยียวยาต่อ นาย ก. หรือประเด็นความเสียหายอย่างไร
  rule_summary: สิทธิเหนือพื้นดินเป็นทรัพยสิทธิเกี่ยวกับอสังหาริมทรัพย์ การได้มาโดยนิติกรรมต้องพิจารณาแบบและการจดทะเบียนตามมาตรา 1299 เพื่อแยกผลระหว่างคู่กรณีกับบุคคลภายนอก
  expected_application:
    - สัญญาระหว่างนาย ก. กับนาย ข. มุ่งก่อตั้งสิทธิเหนือพื้นดิน
    - ยังไม่ได้จดทะเบียน จึงมีปัญหาความบริบูรณ์ของทรัพยสิทธิ
    - นาย ค. ตรวจทะเบียนแล้วไม่พบสิทธิ จึงต้องวิเคราะห์ฐานะบุคคลภายนอก
    - นาย ข. สร้างอาคารไปบางส่วน อาจมีประเด็นเรียกร้องต่อ นาย ก. หรือความเสียหายตามข้อเท็จจริง
  expected_conclusion: นาย ข. มีปัญหาในการอ้างสิทธิเหนือพื้นดินต่อ นาย ค. แต่ควรแยกวิเคราะห์สิทธิเรียกร้องต่อ นาย ก. และการเยียวยาจากความเสียหาย
criteria:
  - id: issue_spotting
    label: จับประเด็นสิทธิเหนือพื้นดิน จดทะเบียน และบุคคลภายนอก
    points: 4
  - id: rule_1299_1410
    label: ระบุหลักมาตรา 1299 และ 1410 ถูกต้อง
    points: 5
  - id: party_effect
    label: แยกผลระหว่างคู่กรณีกับบุคคลภายนอก
    points: 5
  - id: remedies
    label: วิเคราะห์ทางเยียวยาหรือความเสียหาย
    points: 4
  - id: conclusion
    label: สรุปผลเป็นระบบ
    points: 2

