id: r-1304-1307-public-property
title: Rubric สาธารณสมบัติของแผ่นดินและการอ้างสิทธิของเอกชน
max_score: 10
gold_standard:
  statutes: ["1304", "1306", "1307"]
  issues:
    - ทางที่ประชาชนใช้ร่วมกันเป็นสาธารณสมบัติของแผ่นดินหรือไม่
    - เอกชนอ้างสิทธิจากการครอบครองได้หรือไม่
  rule_summary: ต้องพิจารณาว่าทรัพย์เป็นสาธารณสมบัติของแผ่นดินหรือไม่ และผลคุ้มครองที่จำกัดการอ้างอายุความหรือสิทธิส่วนตัวของเอกชน
  expected_application:
    - ทางริมคลองที่ชาวบ้านใช้สัญจรมานานอาจเป็นทรัพย์ที่ประชาชนใช้ร่วมกัน
    - นาย ก. ล้อมรั้วปิดทางและอ้างครอบครองต้องถูกตรวจตามข้อจำกัดของทรัพย์สาธารณะ
    - ต้องแยกจากทรัพย์เอกชนทั่วไปที่อาจครอบครองปรปักษ์ได้
  expected_conclusion: หากเป็นสาธารณสมบัติของแผ่นดิน นาย ก. ไม่อาจอ้างสิทธิแบบทรัพย์เอกชนทั่วไปได้
criteria:
  - id: classification
    label: จำแนกสาธารณสมบัติของแผ่นดิน
    points: 3
  - id: prescription
    label: วิเคราะห์ผลเรื่องอายุความหรือการครอบครอง
    points: 3
  - id: application
    label: ปรับข้อเท็จจริงเรื่องทางที่ประชาชนใช้ร่วมกัน
    points: 3
  - id: conclusion
    label: สรุปผลถูกต้อง
    points: 1

