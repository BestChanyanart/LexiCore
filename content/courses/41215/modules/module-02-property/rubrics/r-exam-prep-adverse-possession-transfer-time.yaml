    points: 2
    expected: "หนึ่งครอบครองที่ดินของสองโดยสงบ เปิดเผย และมีเจตนาเป็นเจ้าของเป็นเวลา 4 ปี เมื่อโอนการครอบครองให้สาม สามอาจนับเวลาครอบครองของหนึ่งรวมกับเวลาของตนได้ หากเป็นการโอนการครอบครองต่อเนื่อง เมื่อรวม 4 ปีของหนึ่งกับ 7 ปีของสามครบกว่า 10 ปี สามจึงมีข้อต่อสู้เรื่องได้กรรมสิทธิ์โดยครอบครองปรปักษ์ตามมาตรา 1382 ประกอบมาตรา 1385"
