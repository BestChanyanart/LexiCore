    label: ปรับข้อเท็จจริงเข้ากับองค์ประกอบกฎหมาย
    points: 3
    expected: "ระบุองค์ประกอบมาตรา 1382 | วิเคราะห์การโอนการครอบครองและการนับเวลาต่อเนื่องตามมาตรา 1385 | รวมระยะเวลา 4+7 ปี | สรุปว่าสามมีข้อต่อสู้"
  - id: conclusion
