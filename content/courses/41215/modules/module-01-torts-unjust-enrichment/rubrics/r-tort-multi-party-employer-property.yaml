id: r-tort-multi-party-employer-property
title: Rubric โจทย์ละเมิดหลายฝ่าย
max_score: 20
gold_standard:
  statutes: ["420", "425", "434", "437"]
  issues:
    - นาย ก. ต้องรับผิดจากการขับรถโดยประมาทหรือไม่
    - บริษัท ข. ต้องรับผิดในผลแห่งละเมิดของลูกจ้างหรือไม่
    - นาย ค. ต้องรับผิดจากกำแพงอาคารชำรุดหรือไม่
    - ควรพิจารณาฐานความรับผิดจากยานพาหนะหรือไม่
  rule_summary: โจทย์ต้องแยกฐานละเมิดทั่วไป ความรับผิดของนายจ้าง ความรับผิดจากสิ่งปลูกสร้าง และความรับผิดจากยานพาหนะ
  expected_application:
    - นาย ก. ขับรถเร็วระหว่างส่งสินค้า อาจเป็นประมาทเลินเล่อ
    - บริษัท ข. เป็นนายจ้างและเหตุเกิดระหว่างส่งสินค้าตามคำสั่ง
    - กำแพงอาคารของนาย ค. ชำรุดอยู่ก่อนและพังทับผู้เสียหาย
    - รถบรรทุกเป็นยานพาหนะที่ต้องพิจารณาผู้ครอบครองหรือควบคุมดูแล
  expected_conclusion: ควรแยกวินิจฉัยความรับผิดของแต่ละคนและอาจมีหลายฐานความรับผิดร่วมกันตามข้อเท็จจริง
criteria:
  - id: issue_spotting
    label: จับประเด็นครบทุกฝ่าย
    points: 4
  - id: rules
    label: ระบุมาตราที่เกี่ยวข้องได้เหมาะสม
    points: 4
  - id: application_employee_employer
    label: ปรับบทนาย ก. และบริษัท ข.
    points: 4
  - id: application_property_vehicle
    label: ปรับบทสิ่งปลูกสร้างและยานพาหนะ
    points: 5
  - id: conclusion
    label: สรุปแยกฝ่ายชัดเจน
    points: 3

