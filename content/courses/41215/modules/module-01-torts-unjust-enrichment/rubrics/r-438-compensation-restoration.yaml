id: r-438-compensation-restoration
title: Rubric ค่าสินไหมทดแทนเพื่อเยียวยาความเสียหาย
max_score: 10
gold_standard:
  statutes: ["420", "438"]
  issues:
    - มีฐานละเมิดที่ทำให้ต้องเยียวยาความเสียหายหรือไม่
    - ควรกำหนดค่าสินไหมทดแทนอย่างไร
  rule_summary: เมื่อมีละเมิด ค่าสินไหมทดแทนต้องมุ่งเยียวยาผู้เสียหายให้กลับคืนหรือใกล้เคียงฐานะเดิม โดยพิจารณาพฤติการณ์และความเสียหายที่เกิดขึ้น
  expected_application:
    - รถชนร้านค้าจากความประมาทเป็นฐานละเมิด
    - กระจกแตกและสินค้าเสียหายเป็นความเสียหายต่อทรัพย์
    - การปิดร้านซ่อมสองวันอาจเป็นความเสียหายต่อรายได้หรือประโยชน์ทางการค้า
    - ต้องแยกรายการเยียวยา ไม่สรุปเป็นตัวเลขลอย ๆ
  expected_conclusion: ควรกำหนดค่าสินไหมตามรายการความเสียหายที่พิสูจน์ได้และเหมาะแก่พฤติการณ์
criteria:
  - id: tort_basis
    label: เชื่อมฐานละเมิดกับการเยียวยา
    points: 2
  - id: damage_categories
    label: แยกประเภทความเสียหายได้
    points: 3
  - id: compensation_principle
    label: อธิบายหลักเยียวยาให้ใกล้เคียงฐานะเดิม
    points: 3
  - id: conclusion
    label: สรุปแนวกำหนดค่าสินไหม
    points: 2

