id: r-406-mistaken-payment
title: Rubric ลาภมิควรได้กรณีโอนเงินผิดบัญชี
max_score: 10
gold_standard:
  statutes: ["406"]
  issues:
    - นาย ค. ได้ลาภโดยไม่มีมูลอันจะอ้างกฎหมายได้หรือไม่
    - นาย ก. มีสิทธิเรียกคืนเงินหรือไม่
  rule_summary: ลาภมิควรได้ต้องมีการได้ประโยชน์ของฝ่ายหนึ่ง ความเสียเปรียบของอีกฝ่าย และไม่มีมูลทางกฎหมายรองรับประโยชน์นั้น
  expected_application:
    - นาย ค. ได้รับเงินเข้าบัญชี
    - เงินเข้าบัญชีเพราะนาย ก. โอนผิด ไม่ใช่เพราะมีหนี้หรือมูลกฎหมาย
    - นาย ก. เสียประโยชน์เท่ากับเงินที่โอนผิด
    - การที่นาย ค. ทราบและนำเงินไปใช้ยิ่งตอกย้ำว่าไม่ควรถือประโยชน์ไว้
  expected_conclusion: นาย ก. มีแนวโน้มเรียกคืนเงินจากนาย ค. ตามหลักลาภมิควรได้
criteria:
  - id: enrichment
    label: วิเคราะห์การได้ประโยชน์ของนาย ค.
    points: 2
  - id: impoverishment
    label: วิเคราะห์ความเสียเปรียบของนาย ก.
    points: 2
  - id: no_legal_ground
    label: วิเคราะห์การไม่มีมูลอันจะอ้างกฎหมายได้
    points: 4
  - id: conclusion
    label: สรุปสิทธิเรียกคืน
    points: 2

