id: r-437-vehicle-liability
title: Rubric ความรับผิดจากยานพาหนะตามมาตรา 437
max_score: 10
gold_standard:
  statutes: ["437"]
  issues:
    - ควรพิจารณาความรับผิดจากยานพาหนะอันเดินด้วยกำลังเครื่องจักรกลหรือไม่
  rule_summary: ต้องพิจารณาว่าความเสียหายเกิดจากยานพาหนะอันเดินด้วยกำลังเครื่องจักรกล และใครเป็นผู้ครอบครองหรือควบคุมดูแล
  expected_application:
    - รถบรรทุกเป็นยานพาหนะอันเดินด้วยกำลังเครื่องจักรกล
    - ความเสียหายเกิดระหว่างการใช้รถบรรทุกขนส่งสินค้า
    - ต้องระบุผู้ครอบครองหรือควบคุมดูแลรถตามข้อเท็จจริง
  expected_conclusion: ควรพิจารณามาตรา 437 และเชื่อมกับผู้ครอบครองหรือควบคุมดูแลยานพาหนะ
criteria:
