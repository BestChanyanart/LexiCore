id: r-exam-tort-employer-vehicle
title: Rubric แนวเก็ง ลูกจ้างขับรถส่งของชนผู้เสียหาย
max_score: 13
gold_standard:
  statutes: ["420", "425", "437"]
  issues:
    - นาย ก. ต้องรับผิดฐานละเมิดหรือไม่
    - บริษัทต้องรับผิดในผลแห่งละเมิดของลูกจ้างหรือไม่
    - ควรพิจารณาฐานความรับผิดจากยานพาหนะหรือไม่
  rule_summary: ต้องแยกมาตรา 420 สำหรับละเมิดของผู้ขับ มาตรา 425 สำหรับนายจ้างเมื่อลูกจ้างทำละเมิดในทางการที่จ้าง และมาตรา 437 สำหรับความเสียหายจากยานพาหนะอันเดินด้วยกำลังเครื่องจักรกล
  expected_application:
    - นาย ก. ขับรถโดยประมาทจนรถนาย ข. เสียหาย จึงเข้าองค์ประกอบละเมิดตามมาตรา 420 หากพิสูจน์เหตุสัมพันธ์ได้
    - นาย ก. เป็นลูกจ้างและขับรถส่งสินค้าตามงานที่บริษัทมอบหมาย จึงควรพิจารณาว่าเกิดในทางการที่จ้างตามมาตรา 425
    - รถส่งสินค้าเป็นยานพาหนะอันเดินด้วยกำลังเครื่องจักรกล จึงควรพิจารณาผู้ครอบครองหรือควบคุมดูแลตามมาตรา 437
  expected_conclusion: นาย ก. มีแนวโน้มต้องรับผิดฐานละเมิด และบริษัทมีแนวโน้มต้องร่วมรับผิดหากเหตุเกิดในทางการที่จ้าง รวมทั้งต้องพิจารณามาตรา 437 ประกอบตามข้อเท็จจริง
criteria:
  - id: driver_tort
    label: วิเคราะห์ละเมิดของนาย ก. ตามมาตรา 420
    points: 4
  - id: employer
    label: วิเคราะห์ความรับผิดนายจ้างตามมาตรา 425
    points: 4
  - id: vehicle
    label: กล่าวถึงประเด็นยานพาหนะตามมาตรา 437
    points: 3
  - id: conclusion
    label: สรุปแยกผู้รับผิดชัดเจน
    points: 2

