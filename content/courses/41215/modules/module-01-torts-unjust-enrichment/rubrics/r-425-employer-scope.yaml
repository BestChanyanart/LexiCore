id: r-425-employer-scope
title: Rubric ความรับผิดนายจ้างตามมาตรา 425
max_score: 10
gold_standard:
  statutes: ["420", "425"]
  issues:
    - บริษัทต้องรับผิดในผลแห่งละเมิดของลูกจ้างหรือไม่
  rule_summary: ต้องมีความสัมพันธ์นายจ้างลูกจ้าง ลูกจ้างทำละเมิด และละเมิดนั้นเกิดในทางการที่จ้าง
  expected_application:
    - นาย ก. เป็นลูกจ้างของบริษัท
    - การขับรถส่งสินค้าเป็นงานตามคำสั่งบริษัท
    - การขับโดยประมาทชนผู้เสียหายเป็นการทำละเมิด
    - เหตุเกิดระหว่างปฏิบัติงานส่งสินค้า จึงควรพิจารณาว่าอยู่ในทางการที่จ้าง
  expected_conclusion: บริษัทมีแนวโน้มต้องรับผิดในผลแห่งละเมิดของนาย ก. หากพิสูจน์ข้อเท็จจริงครบ
criteria:
  - id: employment_relationship
    label: ระบุความสัมพันธ์นายจ้างลูกจ้าง
    points: 2
  - id: tort_by_employee
    label: วิเคราะห์การทำละเมิดของลูกจ้าง
    points: 2
  - id: scope_of_employment
    label: ปรับบทเรื่องในทางการที่จ้าง
    points: 4
  - id: conclusion
    label: สรุปผลความรับผิดของนายจ้าง
    points: 2

