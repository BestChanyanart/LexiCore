id: r-433-animal-liability
title: Rubric ความรับผิดจากสัตว์ตามมาตรา 433
max_score: 10
gold_standard:
  statutes: ["433"]
  issues:
    - เจ้าของหรือผู้ดูแลสัตว์ต้องรับผิดเพื่อความเสียหายจากสัตว์หรือไม่
  rule_summary: ต้องพิจารณาความเสียหายที่เกิดจากสัตว์ ผู้เป็นเจ้าของหรือผู้ควบคุมดูแล และข้อเท็จจริงเรื่องการระมัดระวังหรือเหตุภายนอก
  expected_application:
    - สุนัขเป็นสัตว์ที่ก่อให้เกิดความเสียหายแก่ผู้เสียหาย
    - นาย ก. เป็นผู้เลี้ยงหรือควบคุมดูแล
    - ประตูรั้วชำรุดและไม่ได้ซ่อมเป็นข้อเท็จจริงสำคัญต่อการระมัดระวัง
  expected_conclusion: นาย ก. มีแนวโน้มต้องรับผิดหากไม่สามารถแสดงเหตุยกเว้นตามข้อเท็จจริงได้
criteria:
  - id: animal_damage
    label: ระบุว่าความเสียหายเกิดจากสัตว์
    points: 2
  - id: controller
    label: วิเคราะห์เจ้าของหรือผู้ควบคุมดูแลสัตว์
    points: 2
  - id: care_or_exception
    label: วิเคราะห์การระมัดระวังหรือข้อยกเว้น
    points: 4
  - id: conclusion
    label: สรุปผลถูกต้อง
    points: 2

