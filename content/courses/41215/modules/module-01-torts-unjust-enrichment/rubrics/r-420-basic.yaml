id: r-420-basic
title: Rubric พื้นฐานมาตรา 420
max_score: 10
gold_standard:
  statutes: ["420"]
  issues:
    - นาย ก. ต้องรับผิดฐานละเมิดต่อผู้เสียหายหรือไม่
  rule_summary: มาตรา 420 ครอบคลุมการกระทำโดยจงใจหรือประมาทเลินเล่อโดยผิดกฎหมายที่ทำให้ผู้อื่นเสียหาย และต้องมีเหตุสัมพันธ์ระหว่างการกระทำกับผลเสียหาย
  expected_application:
    - การยกแจกันโดยไม่ตรวจดูให้มั่นคงอาจเป็นการกระทำโดยประมาทเลินเล่อ
    - นาย ข. ได้รับบาดเจ็บเป็นความเสียหาย
    - แจกันตกจากการกระทำของนาย ก. เป็นเหตุให้เกิดความเสียหาย
  expected_conclusion: นาย ก. ต้องรับผิดต่อนาย ข. หากพิสูจน์องค์ประกอบข้างต้นได้ครบ
criteria:
  - id: issue
    label: จับประเด็นความรับผิดฐานละเมิด
    points: 2
  - id: rule
    label: ระบุมาตรา 420 และองค์ประกอบสำคัญ
    points: 3
  - id: application
    label: ปรับข้อเท็จจริงเข้ากับองค์ประกอบ
    points: 4
  - id: conclusion
    label: สรุปผลสอดคล้องกับการวินิจฉัย
    points: 1

