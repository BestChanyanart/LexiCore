id: r-395-401-neighbor-roof-repair
title: Rubric จัดการงานนอกสั่งกรณีซ่อมหลังคาเพื่อนบ้าน
max_score: 10
gold_standard:
  statutes: ["395", "401"]
  issues:
    - นาย ก. เข้าองค์ประกอบจัดการงานนอกสั่งหรือไม่
    - นาย ก. เรียกค่าใช้จ่ายจากนาย ข. ได้หรือไม่
  rule_summary: ต้องพิจารณาการเข้าทำกิจการแทนผู้อื่นโดยไม่ได้รับมอบหมาย ความสมประโยชน์ของตัวการ และผลเรื่องค่าใช้จ่ายที่ผู้จัดการออกไป
  expected_application:
    - หลังคาบ้านเป็นกิจการหรือประโยชน์ของนาย ข.
    - นาย ข. ไม่อยู่และไม่ได้มอบหมายให้นาย ก. ทำ
    - การซ่อมชั่วคราวระหว่างพายุมีเหตุผลเพื่อป้องกันความเสียหาย
    - ค่าใช้จ่ายควรพิจารณาว่าเหมาะสมและสมประโยชน์หรือไม่
  expected_conclusion: นาย ก. มีแนวโน้มเรียกค่าใช้จ่ายที่สมควรได้ หากพิสูจน์ว่าเป็นจัดการงานนอกสั่งที่สมประโยชน์ของนาย ข.
criteria:
  - id: issue
    label: จับประเด็นจัดการงานนอกสั่งและค่าใช้จ่าย
    points: 2
  - id: rule
    label: ระบุหลักมาตรา 395 และ 401
    points: 3
  - id: application
    label: ปรับข้อเท็จจริงเรื่องไม่ได้รับมอบหมายและสมประโยชน์
    points: 4
  - id: conclusion
    label: สรุปผลถูกต้อง
    points: 1

