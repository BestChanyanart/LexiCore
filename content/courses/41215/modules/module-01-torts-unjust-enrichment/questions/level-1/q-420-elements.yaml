id: q-420-elements
course_id: 41215
module_id: module-01-torts-unjust-enrichment
level: 1
type: mcq
title: องค์ประกอบมาตรา 420
scenario: เลือกข้อความที่อธิบายองค์ประกอบสำคัญของละเมิดทั่วไปตามมาตรา 420 ได้ถูกต้องที่สุด
question: ข้อใดกล่าวถูกต้อง
statutes: ["420"]
choices:
  - id: a
    text: ต้องมีเจตนาทำให้เสียหายเท่านั้น จึงเป็นละเมิด
    is_correct: false
    misconception: คิดว่าละเมิดต้องเกิดจากเจตนาเท่านั้น
    rationale: มาตรา 420 ครอบคลุมทั้งการกระทำโดยจงใจและประมาทเลินเล่อ
  - id: b
    text: ต้องมีการกระทำโดยจงใจหรือประมาทเลินเล่อโดยผิดกฎหมาย เกิดความเสียหาย และมีเหตุสัมพันธ์
    is_correct: true
    rationale: คำตอบนี้ครอบคลุมองค์ประกอบหลักของมาตรา 420
hints:
  - level: 1
    kind: focus_area
    text: โจทย์ถามฐานละเมิดทั่วไป
  - level: 2
    kind: key_elements
    text: มองหาคำว่า จงใจ ประมาทเลินเล่อ ความเสียหาย และเหตุสัมพันธ์
  - level: 3
    kind: statute_number
    text: พิจารณาประมวลกฎหมายแพ่งและพาณิชย์ มาตรา 420

