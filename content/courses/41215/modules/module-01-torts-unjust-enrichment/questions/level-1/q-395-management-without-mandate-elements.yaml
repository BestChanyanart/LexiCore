id: q-395-management-without-mandate-elements
course_id: 41215
module_id: module-01-torts-unjust-enrichment
level: 1
type: mcq
title: องค์ประกอบจัดการงานนอกสั่ง
source:
  unit: 5
  file: source-materials/raw/41215-5.pdf
scenario: เลือกข้อความที่อธิบายลักษณะของจัดการงานนอกสั่งได้ถูกต้องที่สุด
question: ข้อใดเป็นจุดเริ่มต้นที่ถูกต้องในการพิจารณาจัดการงานนอกสั่ง
statutes: ["395"]
choices:
  - id: a
    text: ผู้จัดการทำกิจการแทนผู้อื่นโดยมีสัญญาจ้างหรือสัญญาตัวแทนอยู่ก่อน
    is_correct: false
    misconception: สับสนจัดการงานนอกสั่งกับสัญญาตัวแทนหรือจ้างทำของ
    rationale: จัดการงานนอกสั่งต้องเริ่มจากการเข้าทำกิจการแทนผู้อื่นโดยไม่ได้ถูกว่าขานวานใช้หรือไม่มีสิทธิเดิม
  - id: b
    text: ผู้จัดการเข้าทำกิจการแทนผู้อื่นโดยไม่ได้รับมอบหมายและต้องพิจารณาว่าสมประโยชน์ของตัวการหรือไม่
    is_correct: true
    rationale: คำตอบนี้ตรงกับแกนของมาตรา 395 และเป็นฐานก่อนพิจารณาผลตามมาตราอื่น
  - id: c
    text: ผู้จัดการทำสิ่งใดก็ตามที่ทำให้ตนเองได้ประโยชน์เป็นหลัก
    is_correct: false
    misconception: ลืมว่าการจัดการต้องเกี่ยวกับกิจการของผู้อื่น ไม่ใช่ประโยชน์ของผู้จัดการเองโดยแท้
    rationale: หากทำเพื่อประโยชน์ของตนเองเป็นหลัก ย่อมไม่ใช่ฐานจัดการงานนอกสั่งตามโครงสร้างนี้
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้ถามเรื่องจัดการงานนอกสั่ง
  - level: 2
    kind: key_elements
    text: มองหาการเข้าทำกิจการแทนผู้อื่นโดยไม่ได้รับมอบหมาย
  - level: 3
    kind: statute_number
    text: พิจารณามาตรา 395

