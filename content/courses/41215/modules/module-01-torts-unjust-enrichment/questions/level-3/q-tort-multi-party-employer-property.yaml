id: q-tort-multi-party-employer-property
course_id: 41215
module_id: module-01-torts-unjust-enrichment
level: 3
type: subjective
title: เหตุละเมิดหลายฝ่ายจากลูกจ้าง รถ และสิ่งปลูกสร้าง
scenario: >
  บริษัท ข. จ้างนาย ก. เป็นพนักงานส่งของ วันเกิดเหตุ นาย ก. ขับรถบรรทุกไปส่งสินค้าตามคำสั่งบริษัทด้วยความเร็วสูง รถเสียหลักชนกำแพงอาคารเก่าของนาย ค. ซึ่งชำรุดอยู่ก่อนแล้ว กำแพงพังลงมาทับนาย ง. ที่ยืนอยู่ริมทางได้รับบาดเจ็บ
question: ให้วินิจฉัยความรับผิดของนาย ก. บริษัท ข. และนาย ค. ต่อความเสียหายของนาย ง. โดยแยกประเด็นและมาตราที่เกี่ยวข้อง
statutes: ["420", "425", "434", "437"]
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้มีทั้งละเมิดจากการกระทำของตนเอง ความรับผิดของนายจ้าง ยานพาหนะ และสิ่งปลูกสร้าง
  - level: 2
    kind: key_elements
    text: แยกผู้ทำละเมิดโดยตรง ผู้รับผิดแทน ผู้ครอบครองยานพาหนะ และเจ้าของหรือผู้ครอบครองสิ่งปลูกสร้าง
  - level: 3
    kind: statute_number
    text: พิจารณามาตรา 420, 425, 434 และ 437
rubric_id: r-tort-multi-party-employer-property

