title: ผู้ครอบครองรถกับความเสียหายจากยานพาหนะ
scenario: >
  นาย ก. ให้ลูกจ้างขับรถบรรทุกของกิจการไปส่งสินค้า รถบรรทุกเกิดเสียหลักชนรถของนาย ข. เสียหายระหว่างการขนส่ง
question: ให้วินิจฉัยว่าควรพิจารณาความรับผิดจากยานพาหนะตามหลักใด
statutes: ["437"]
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้เกี่ยวกับความเสียหายจากยานพาหนะอันเดินด้วยกำลังเครื่องจักรกล
  - level: 2
    kind: key_elements
    text: มองหาผู้ครอบครองหรือควบคุมดูแลยานพาหนะและเหตุที่ทำให้เกิดความเสียหาย
  - level: 3
    kind: statute_number
    text: พิจารณามาตรา 437
rubric_id: r-437-vehicle-liability

