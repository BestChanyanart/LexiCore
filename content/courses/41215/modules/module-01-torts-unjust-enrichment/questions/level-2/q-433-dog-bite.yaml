scenario: >
  นาย ก. เลี้ยงสุนัขไว้ในบ้าน แต่ประตูรั้วชำรุดและไม่ได้ซ่อมแซม สุนัขหลุดออกไปกัดนาย ข. ซึ่งเดินผ่านหน้าบ้านจนได้รับบาดเจ็บ
question: ให้วินิจฉัยว่านาย ก. ต้องรับผิดเพื่อความเสียหายอันเกิดจากสัตว์หรือไม่
