title: ซ่อมหลังคาบ้านเพื่อนบ้านระหว่างพายุ
source:
  unit: 5
  file: source-materials/raw/41215-5.pdf
scenario: >
  นาย ก. เห็นหลังคาบ้านนาย ข. เปิดหลุดระหว่างพายุฝนและน้ำกำลังไหลเข้าไปทำลายทรัพย์สินในบ้าน นาย ข. ไม่อยู่และติดต่อไม่ได้ นาย ก. จึงจ้างช่างซ่อมชั่วคราวและออกค่าใช้จ่ายไปก่อน
question: ให้วินิจฉัยว่านาย ก. อาจเรียกค่าใช้จ่ายจากนาย ข. บนฐานจัดการงานนอกสั่งได้หรือไม่
statutes: ["395", "401"]
hints:
  - level: 1
    kind: focus_area
    text: โจทย์นี้เกี่ยวกับการเข้าทำกิจการแทนผู้อื่นโดยไม่ได้รับมอบหมาย
  - level: 2
    kind: key_elements
    text: ตรวจว่าเป็นกิจการของนาย ข. นาย ก. ไม่มีหน้าที่เดิม และการซ่อมสมประโยชน์หรือป้องกันความเสียหายหรือไม่
  - level: 3
    kind: statute_number
    text: พิจารณามาตรา 395 และผลเรื่องค่าใช้จ่ายตามมาตรา 401
rubric_id: r-395-401-neighbor-roof-repair

